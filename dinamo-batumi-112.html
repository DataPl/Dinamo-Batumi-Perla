<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<title>Dinamo Batumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DINAMO BATUMI — matchday design system
   1. tokens   2. base + shell   3. Home   4. Matches   5. Squad
   6. Table    7. tap targets    8. motion + preferences
   Blue rule: --blue is a FILL on one element per screen (Home hero,
   Matches next-fixture bar, Squad top-scorer number, Table Dinamo row).
   ===================================================================== */

/* ---------- 1. tokens ---------- */
:root{
  color-scheme:light dark;
  /* surface + text */
  --bg:#f4f3ee; --surface:#fdfcfa; --ink:#0c1020; --mut:#5d6170; --line:#dcdad2;
  /* club blue: --blue fills (white text on it), --mark draws bars/tints/numerals on the page */
  --blue:#1432a6; --on-blue:#fff; --mark:#1432a6;
  /* results: each fill has its own text colour, so W/D/L reads in both modes */
  --win:#13764a;  --on-win:#fff;
  --draw:#5f677b; --on-draw:#fff;
  --lose:#b3261e; --on-lose:#fff;
  --warn:#9a5c00;
  /* type */
  --d:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --b:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --n-xl:clamp(3rem,16vw,4rem); --n-l:2.5rem; --n-m:1.75rem; --n-s:1.25rem;
  --t-cap:.75rem; --t-body:.9375rem; --t-sm:.8125rem;
  /* space (4pt) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --pad:max(18px,env(safe-area-inset-left),env(safe-area-inset-right));
  --tap:44px;
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.2,.8,.2,1);
  --t-press:140ms; --t-in:300ms;
  /* aliases the sheet / admin / player-card rules were written against */
  --ac:var(--mark); --on:#fff; --card:var(--surface); --hero:var(--blue); --hero2:#0b1f6e;
  --sea:#38bdf8; --gold:#f2c14e; --pitch:#2c5a3c; --pl:#ffffff55; --sh:none; --r:6px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12; --surface:#12151c; --ink:#ecedf1; --mut:#9aa1b1; --line:#262a36;
  --blue:#1a37b8; --mark:#8fa8ff;
  --win:#4cc38a;  --on-win:#06210f;
  --draw:#8b92a3; --on-draw:#0b0d12;
  --lose:#ff7a70; --on-lose:#2a0603;
  --warn:#e0a24f;
  --on:#0a0d16; --hero2:#0a1654; --pitch:#1f4430;
}}
@media(prefers-contrast:more){:root{--line:#7a8194;--mut:#3f4658}}
@media(prefers-contrast:more) and (prefers-color-scheme:dark){:root{--line:#6b748a;--mut:#c4c9d6}}

/* zones: --z draws the table bar (mid = none), --zc colours ladder + legend */
.z-champions{--z:var(--mark);--zc:var(--mark)}
.z-conference{--z:var(--win);--zc:var(--win)}
.z-playoff{--z:var(--warn);--zc:var(--warn)}
.z-relegation{--z:var(--lose);--zc:var(--lose)}
.z-mid,.z-none{--z:transparent;--zc:var(--mut)}

/* ---------- 2. base + shell ---------- */
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font:400 var(--t-body)/1.5 var(--b);-webkit-font-smoothing:antialiased;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:680px;margin:0 auto;padding:0 var(--pad)}

header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:var(--s3);max-width:680px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) var(--pad) 8px;background:var(--bg);border-bottom:1px solid var(--ink)}
header>div:nth-child(2){min-width:0}
header h1{font:700 1.375rem/1 var(--d);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;margin-top:3px;font:500 var(--t-cap)/1.2 var(--b);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;overflow:visible;font:700 .8125rem/1 var(--d);letter-spacing:.04em;cursor:default}
.crest::after{content:"";position:absolute;inset:-4px}
.crest img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.gear{margin-left:auto;flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--ink);cursor:pointer}
.gear svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;max-width:680px;margin:0 auto;background:var(--bg);border-top:1px solid var(--ink);padding:0 max(6px,env(safe-area-inset-left)) env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;background:none;border:0;color:var(--mut);font:700 .6875rem/1 var(--d);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:color var(--t-press)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t-press) var(--ease)}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";position:absolute;top:-1px;left:20%;right:20%;height:3px;background:var(--ink)}
nav button:active svg{transform:scale(.88)}

.tap{cursor:pointer;transition:background-color var(--t-press),transform var(--t-press) var(--ease)}
.tap:active{transform:scale(.985)}
.empty,.ov-empty{padding:var(--s6) 0;text-align:center;color:var(--mut);font:600 var(--t-sm) var(--d);letter-spacing:.16em;text-transform:uppercase}

/* shared section header (Home) */
.o-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:var(--tap)}
.o-h h2{margin:0;font:700 var(--t-sm)/1 var(--d);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.o-link{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);margin-right:-4px;padding:0 4px 0 var(--s3);background:none;border:0;color:var(--ink);font:700 var(--t-sm) var(--b);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
.o-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 3. Home ---------- */
.ov{padding-bottom:var(--s5)}
.o-sec{margin-top:var(--s4);padding-top:var(--s1);border-top:1px solid var(--line)}
.nx+.o-sec{margin-top:0;border-top:0}

.nx{margin:0 calc(var(--pad) * -1);padding:var(--s4) var(--pad) 0;background:var(--blue);color:var(--on-blue);text-align:center}
@media(min-width:700px){.nx{margin:0;border-radius:6px;overflow:hidden}}
.nx:focus-visible{outline:2px solid #fff;outline-offset:-5px}
.nx-lab{display:inline-block;padding:6px 10px 5px;background:#fff;color:var(--blue);font:800 var(--t-cap)/1 var(--d);letter-spacing:.22em;text-transform:uppercase}
.nx-top{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s1) var(--s3);margin-top:var(--s3);font:600 var(--t-sm)/1.3 var(--b);color:#ffffffd9}
.nx-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:var(--s2);align-items:start;margin:var(--s4) 0}
.nx-tm{display:flex;flex-direction:column;align-items:center;gap:var(--s2);min-width:0;font:800 clamp(1.125rem,5.6vw,1.5rem)/1 var(--d);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.nx .bd{width:72px;height:72px;font-size:22px;background:#ffffff1f;border:2px solid #ffffff99;color:#fff}
.nx .bd.lgo{background:#fff;border:0;padding:6px}
.nx .bd.me{background:#fff;border-color:#fff;color:var(--blue)}
.nx-at{margin-top:28px;font:700 var(--t-cap)/1 var(--d);letter-spacing:.2em;text-transform:uppercase;color:#ffffffbf}
.nxc{display:grid;grid-template-columns:repeat(3,1fr);margin:0 calc(var(--pad) * -1);background:#00000029;border-top:1px solid #ffffff33}
.nxc>div{padding:var(--s3) var(--s2) var(--s2);border-left:1px solid #ffffff26}
.nxc>div:first-child{border-left:0}
.nxc b{display:block;font:800 var(--n-l)/.95 var(--d);font-variant-numeric:tabular-nums}
.nxc span{display:block;margin-top:var(--s1);font:700 .6875rem/1 var(--d);letter-spacing:.18em;text-transform:uppercase;color:#ffffffc7}
.nxc .today{grid-column:1/-1;padding:var(--s4);border:0;font:800 var(--n-m)/1 var(--d);text-transform:uppercase}
.nx-when{margin:0 calc(var(--pad) * -1);padding:var(--s3) var(--pad) var(--s4);background:#0000003d;font:700 var(--t-body)/1.3 var(--b)}
.nx-when small{display:block;margin-top:2px;font:500 var(--t-sm) var(--b);color:#ffffffc7}
@media(min-width:700px){.nxc,.nx-when{margin-left:0;margin-right:0}}

/* form tiles: result + opponent + score, one tap to the match */
.ft-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);padding-bottom:var(--s3)}
.ft{display:flex;flex-direction:column;align-items:center;gap:var(--s2);min-height:var(--tap);padding:0 0 var(--s2);overflow:hidden;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:transform var(--t-press) var(--ease)}
.ft:active{transform:scale(.97)}
.ft-r{align-self:stretch;height:26px;display:grid;place-items:center;font:800 .9375rem/1 var(--d);letter-spacing:.06em}
.ft.W .ft-r{background:var(--win);color:var(--on-win)}
.ft.D .ft-r{background:var(--draw);color:var(--on-draw)}
.ft.L .ft-r{background:var(--lose);color:var(--on-lose)}
.ft .bd{width:28px;height:28px;font-size:10px}
.ft-s{font:800 1.125rem/1 var(--d);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ft.last{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* league position + key stats */
.o-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);padding-top:var(--s1)}
.o-rank b{display:block;font:800 var(--n-xl)/.82 var(--d);letter-spacing:-.02em}
.o-rank b sup{position:relative;top:.06em;margin-left:2px;font-size:.34em;letter-spacing:0;vertical-align:top}
.o-rank span,.o-pts span{display:block;margin-top:var(--s2);font:600 var(--t-sm)/1 var(--b);color:var(--mut)}
.o-pts{text-align:right}
.o-pts b{display:block;font:800 var(--n-l)/.85 var(--d);font-variant-numeric:tabular-nums}
.lad{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:var(--s4)}
.lad i{flex:1;height:8px;background:var(--zc);opacity:.4;border-radius:1px}
.lad i.me{height:24px;opacity:1;background:var(--ink)}
.lad-k{display:flex;justify-content:space-between;margin-top:var(--s1);font:600 .75rem/1 var(--b);color:var(--mut)}
.o-stats{display:flex;justify-content:space-between;margin-top:var(--s3);border-top:1px solid var(--line)}
.o-stats>div{padding:var(--s3) var(--s3) var(--s1) 0}
.o-stats>div+div{padding-left:var(--s3);border-left:1px solid var(--line)}
.o-stats b{display:block;font:800 var(--n-m)/1 var(--d);font-variant-numeric:tabular-nums;white-space:nowrap}
.o-stats span{display:block;margin-top:var(--s1);font:600 var(--t-cap)/1.2 var(--b);color:var(--mut)}
.o-zone{margin-top:var(--s3);padding:2px 0 2px var(--s3);border-left:3px solid var(--zc);font:600 var(--t-sm)/1.3 var(--b)}

/* top scorer: one compact row */
.o-sw{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s2) 0 var(--s3);cursor:pointer}
.o-sw .av{flex:none;width:56px;height:56px;display:grid;place-items:center;overflow:hidden;border-radius:50%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:800 1.5rem/1 var(--d);box-shadow:none}
.o-sw .av img{width:100%;height:100%;object-fit:cover;border-radius:0;box-shadow:none}
.o-sn{flex:1;min-width:0}
.o-sn b{display:block;font:700 1.0625rem/1.2 var(--b)}
.o-sn span{display:block;margin-top:2px;font:500 var(--t-sm)/1.3 var(--b);color:var(--mut)}
.o-sg{flex:none;text-align:right}
.o-sg b{display:block;font:800 var(--n-l)/.9 var(--d);font-variant-numeric:tabular-nums}
.o-sg span{display:block;margin-top:var(--s1);font:700 .6875rem/1 var(--d);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}

/* club facts: one short row */
.o-club dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:var(--s3);margin:0;padding:var(--s1) 0 var(--s2)}
.o-club dt{font:700 .6875rem/1 var(--d);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.o-club dd{margin:var(--s1) 0 0;font:600 var(--t-body)/1.25 var(--b)}
.o-club dd small{display:block;margin-top:2px;font:400 var(--t-sm) var(--b);color:var(--mut)}

/* ---------- 4. Matches ---------- */
.mbar{padding-top:var(--s2)}
.mrow2{border-bottom:1px solid var(--ink)}
.seg{display:flex;gap:var(--s5)}
.seg button{position:relative;flex:none;min-height:var(--tap);margin-bottom:-1px;padding:0;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:700 var(--t-sm)/1 var(--d);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.seg button.on{color:var(--ink);border-bottom-color:var(--ink)}
.mdds{display:flex;gap:var(--s2);padding:var(--s3) 0}
.mdds .dd{flex:1 1 0;min-width:0}
.mdds .ddb{min-height:var(--tap);padding:0 var(--s3);background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:6px;font:700 var(--t-sm) var(--b);letter-spacing:0}
.mdds .dd.dis .ddb{color:var(--mut);border-color:var(--line)}
.mdds .tfb{min-width:var(--tap);min-height:var(--tap);padding:0 var(--s3);border-radius:6px}
@media(max-width:479px){.mdds .tfb:not(.on){padding:0}.mdds .tfb{justify-content:center}.mdds .tfb span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}

.m-rec{padding:var(--s3) 0 var(--s4);border-bottom:1px solid var(--line)}
.m-rec-h{margin-bottom:var(--s2);font:700 var(--t-cap)/1 var(--d);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.m-rec-g{display:grid;grid-template-columns:.8fr 1.5fr 1fr}
.m-rec-g>div+div{padding-left:var(--s4);border-left:1px solid var(--line)}
.m-rec-g b{display:block;font:800 var(--n-m)/1 var(--d);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-rec-g b u{text-decoration:none;color:var(--mut);padding:0 1px}
.m-rec-g em{font-style:normal}
.m-rec-g em.W{color:var(--win)}.m-rec-g em.L{color:var(--lose)}
.m-rec-g span{display:block;margin-top:var(--s1);font:500 var(--t-cap)/1.2 var(--b);color:var(--mut)}
.m-bar{display:flex;gap:2px;height:6px;margin-top:var(--s3)}
.m-bar i{display:block;height:100%;min-width:0}
.m-bar i.W{background:var(--win)}.m-bar i.D{background:var(--draw)}.m-bar i.L{background:var(--lose)}
.m-sp-t{margin-top:var(--s5);font:700 var(--t-cap)/1 var(--d);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.m-sr{display:grid;grid-template-columns:minmax(0,1fr) 30px 84px 62px;align-items:center;gap:6px;min-height:var(--tap);padding:var(--s2) 0;border-bottom:1px solid var(--line);font:600 var(--t-body) var(--b)}
.m-sr.hd{min-height:0;padding:var(--s2) 0 6px;border-bottom:1px solid var(--ink);font:600 .6875rem var(--b);color:var(--mut)}
.m-sr.hd .m-sl{font:inherit}
.m-sl{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-sl .lg{width:18px;height:18px;margin-right:8px}
.m-sp,.m-sw,.m-sg{text-align:right;font-variant-numeric:tabular-nums}
.m-sw em,.m-sg{font-style:normal}
.m-sw em.W{color:var(--win)}.m-sw em.L{color:var(--lose)}
.m-sr:not(.hd) .m-sw{font-weight:700}
.m-sr.tap{margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad)}

.mh{position:sticky;top:var(--hh,58px);z-index:3;display:flex;align-items:baseline;justify-content:space-between;margin:var(--s3) calc(var(--pad) * -1) 0;padding:var(--s2) var(--pad);background:var(--bg);border-bottom:1px solid var(--ink);font:800 1.25rem/1 var(--d);letter-spacing:.04em;text-transform:uppercase}
.mh small{margin-left:var(--s2);font:600 var(--t-sm) var(--b);letter-spacing:0;color:var(--mut)}
.mh em{font:700 var(--t-sm) var(--b);font-style:normal;letter-spacing:0;color:var(--mut)}

.mi{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 62px;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color var(--t-press),transform var(--t-press) var(--ease)}
.mi-d{text-align:center}
.mi-d b{display:block;font:800 var(--n-m)/1 var(--d);font-variant-numeric:tabular-nums}
.mi-d span{display:block;margin-top:3px;font:600 .6875rem/1 var(--b);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mi-t{min-width:0}
.mi-r{display:flex;align-items:center;gap:var(--s2);min-height:28px;color:var(--mut)}
.mi-r .bd{width:24px;height:24px;font-size:9px;flex:none}
.mi-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 var(--t-body)/1.2 var(--b)}
.mi-r i{flex:none;min-width:1.5ch;text-align:right;font:700 1.25rem/1 var(--d);font-style:normal;font-variant-numeric:tabular-nums}
.mi-r.w{color:var(--ink)}
.mi-r.w .mi-n{font-weight:800}
.mi-r.w i{font-weight:800}
.mi-m{margin-top:2px;font:500 var(--t-cap)/1.3 var(--b);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-s{display:flex;flex-direction:column;align-items:center;gap:var(--s1);min-width:0}
.mi-res{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;font:800 1.125rem/1 var(--d)}
.mi-res.W{background:var(--win);color:var(--on-win)}
.mi-res.D{background:var(--draw);color:var(--on-draw)}
.mi-res.L{background:var(--lose);color:var(--on-lose)}
.mi-ft{font:700 var(--t-cap)/1 var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mi-time{font:800 var(--n-s)/1 var(--d);font-variant-numeric:tabular-nums}
.mi-ha{font:600 .6875rem/1 var(--b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tag{font:800 .6875rem/1 var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--mark)}
.mi.nxt{margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad);background:color-mix(in srgb,var(--mark) 9%,transparent);box-shadow:inset 4px 0 var(--mark)}
.o-res .mi{border-bottom:0}

/* ---------- 5. Squad ---------- */
.sq-bar{padding-top:var(--s3)}
.sq-s{position:relative}
.sq-s svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.sq-s input{width:100%;min-height:var(--tap);padding:0 var(--s3) 0 42px;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:6px;font:500 1rem var(--b)}
.sq-cs{display:flex;gap:var(--s2);overflow-x:auto;margin:var(--s3) calc(var(--pad) * -1) 0;padding:0 var(--pad) var(--s2);scrollbar-width:none}
.sq-cs::-webkit-scrollbar{display:none}

/* ---------- 9. motion pass (20-tip checklist) ---------- */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease:var(--ease-out);--ease-io:cubic-bezier(.77,0,.175,1)}
/* 4 + 14: press = scale .97, instant while held, eased release */

.btn,.back,.allb,.chips button,.fc,.luform,.luib,.ddb,.tap,.x{transition-duration:.2s}
@media(prefers-reduced-motion:no-preference){
/* 1 + 3: ease-out entrances, rows staggered 30ms (capped at 10) */
@keyframes rise2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.anim .mi:nth-child(1),.anim .sq-r:nth-child(1),.anim .tbt tbody tr:nth-child(1),.anim .mrow:nth-child(1){animation-delay:0ms}
.anim .mi:nth-child(2),.anim .sq-r:nth-child(2),.anim .tbt tbody tr:nth-child(2),.anim .mrow:nth-child(2){animation-delay:30ms}
.anim .mi:nth-child(3),.anim .sq-r:nth-child(3),.anim .tbt tbody tr:nth-child(3),.anim .mrow:nth-child(3){animation-delay:60ms}
.anim .mi:nth-child(4),.anim .sq-r:nth-child(4),.anim .tbt tbody tr:nth-child(4),.anim .mrow:nth-child(4){animation-delay:90ms}
.anim .mi:nth-child(5),.anim .sq-r:nth-child(5),.anim .tbt tbody tr:nth-child(5),.anim .mrow:nth-child(5){animation-delay:120ms}
.anim .mi:nth-child(6),.anim .sq-r:nth-child(6),.anim .tbt tbody tr:nth-child(6),.anim .mrow:nth-child(6){animation-delay:150ms}
.anim .mi:nth-child(7),.anim .sq-r:nth-child(7),.anim .tbt tbody tr:nth-child(7),.anim .mrow:nth-child(7){animation-delay:180ms}
.anim .mi:nth-child(8),.anim .sq-r:nth-child(8),.anim .tbt tbody tr:nth-child(8),.anim .mrow:nth-child(8){animation-delay:210ms}
.anim .mi:nth-child(9),.anim .sq-r:nth-child(9),.anim .tbt tbody tr:nth-child(9),.anim .mrow:nth-child(9){animation-delay:240ms}
.anim .mi:nth-child(10),.anim .sq-r:nth-child(10),.anim .tbt tbody tr:nth-child(10),.anim .mrow:nth-child(10){animation-delay:270ms}

/* 2 + 10 + 11: popovers 200ms, start at .95, grow out of the trigger edge */
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.ddl:not([hidden]),.lumenu:not([hidden]),.cbl:not([hidden]),.evl:not([hidden]){animation:pop .2s var(--ease-out) both;transform-origin:50% 0}
.lumenu:not([hidden]){transform-origin:100% 0}
/* 9: on-screen moves ease-in-out */
.pitch.ed .dot:not(.dragging){transition:left .26s var(--ease-io),top .26s var(--ease-io)}
.mrow{transition:background-color .2s,transform .3s var(--ease-io)}
/* 15: exits ~20% shorter than entrances */
.toast{transition:opacity .16s ease-in,transform .2s ease-in}
.toast.on{transition:opacity .2s var(--ease-out),transform .25s var(--ease-out)}
/* 8 + 18: success pulse, icon crossfades in with blur */
@keyframes ok{0%{opacity:0;transform:scale(.6);filter:blur(4px)}60%{opacity:1;transform:scale(1.18);filter:blur(0)}100%{transform:scale(1)}}
.toast.on svg{animation:ok .4s var(--ease-out) both}
/* 18: nav icons crossfade between states, active bar draws in */
nav svg{transition:transform .2s var(--ease-out),opacity .2s,filter .2s}
nav button:not(.on) svg{opacity:.7}
nav button:active svg{transform:scale(.9);filter:blur(.5px)}
@keyframes bar{from{transform:scaleX(0)}to{transform:none}}

/* 16: tab switches overlap old and new views */
header{view-transition-name:hdr} nav{view-transition-name:nav}

.swr{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--tap);margin-top:6px;padding:var(--s3) 0;background:none;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink);text-align:left;cursor:pointer}

const luKeys = lu => { const s = new Set(); if (!lu) return s; [...V(lu.start), ...V(lu.subs)].filter(Boolean).forEach(id => { s.add(KEY(id)); const p = L(D.players).find(q => q.id === id || KEY(q.name) === KEY(id)); if (p) { s.add(KEY(p.name)); if (p.name_ru) s.add(KEY(p.name_ru)); } }); return s; };

function evSquad(side){
  const name = mt()[side], num = x => x.number === "" || x.number == null ? 999 : +x.number;

    clubs: list("clubs", L(D.clubs).sort(byName), x => `<span class="al">${adT(x.logo, inits(x.name))}<span class="at"><b>${esc(x.name)}</b><small>${esc([x.league, x.city].filter(Boolean).join(", "))}</small></span></span>`, "Other clubs", "Opponents and their squads", x => sk(x.name, x.name_ru, x.short, x.league, x.city, x.country), byC("No league", "league")),
    nations: list("nations", L(D.nations).sort(byName), x => `<span class="al">${adT(x.logo, inits(x.name))}<span class="at"><b>${esc(x.name)}</b></span></span>`, "National teams", "Used for player caps", x => sk(x.name)),
    trophies: list("trophies", L(D.trophies).sort(byName), x => `<span class="al">${adT(x.image, inits(x.name))}<span class="at"><b>${esc(x.name)}</b><small>${esc(x.kind || "")}</small></span></span>`, "Trophies", "Honours on player profiles", x => sk(x.name, x.name_ru, x.kind), x => { const k = x.kind || ""; return {k:KEY(k), html:`<span>${esc(k || "Other")}</span>`, ord:k ? "0" + KEY(k) : "1"}; })
  };
  return `<div class="adx-wrap${q ? " q" : ""}">${LIVE ? "" : '<div class="hint adx-note">Local mode: edits are not saved. Add FIREBASE_CONFIG to go live.</div>'}
  <div class="adx-hd"><h1>Admin</h1><span class="adx-st${LIVE ? "" : " off"}">${LIVE ? "Live" : "Local mode"}</span></div>

  <div class="adx-club tap" onclick="editItem('club')">${adT(D.club.logo, D.club.short || inits(D.club.name), true)}<span class="at"><b>${esc(D.club.name)}</b><small>Name, stadium, coach, usual lineup</small></span><span class="adx-pill">Edit</span></div>
  <div class="hint">Renaming the club also updates matches, the table and player stats.</div>
  ${matchMedia("(hover:hover) and (pointer:fine)").matches ? '<div class="hint">Shortcuts: <b>N</b> new match, <b>P</b> new player. In the editor: <b>Ctrl+S</b> save, <b>Ctrl+Enter</b> save &amp; add another, <b>Esc</b> close.</div>' : ""}
  <div class="adx-bar"><input id="admq" type="search" placeholder="Search matches, players, clubs…" value="${esc(admQ)}" oninput="admFilter(this.value)" autocomplete="off" enterkeyhint="search" aria-label="Search everything"></div>
  <div class="adx-none" id="admnone"${q && !total ? "" : " hidden"}>Nothing matches “${esc(admQ.trim())}”.</div>
  <div class="adx-h">Matchday</div>${S.matches}${S.table}
  <div class="adx-h">People</div>${S.players}${S.referees}
  <div class="adx-h">Reference lists</div>${S.leagues}${S.clubs}${S.nations}${S.trophies}
  <div class="adx-h">Links</div>${sec("links", "Links", null, "", `<div class="lnk-f"><label for="lnkan">Season analytics page (opened from the Overview tab)</label><input id="lnkan" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="${AN_DEF}" value="${esc((D.club && D.club.analyticsUrl) || "")}" onkeydown="if(event.key==='Enter')lnkSave()"><label for="lnkbk">Back button on the analytics page</label><input id="lnkbk" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="dinamo-batumi-111.html" value="${esc((D.club && D.club.backUrl) || "")}" onkeydown="if(event.key==='Enter')lnkSave()"><div class="hint">These links are shared: they change on every device. Use a full link (https://…) or a file name next to this page. Leave empty for the default.</div><div class="btns"><button class="btn" onclick="lnkSave()">Save link</button><button class="btn alt" onclick="lnkSave(true)">Reset</button><a class="btn alt" href="${esc(anUrl())}" style="text-decoration:none;text-align:center">Open</a></div></div>`, "", "Shared links, same on every device", admOpen.has("links"))}

}
/* live preview for image-link fields in the editor */
$("#sbody").addEventListener("input", e => { const t = e.target; if (!t.dataset || !IMGK.includes(t.dataset.k)) return; const p = t.previousElementSibling && t.previousElementSibling.querySelector(".ipv"); if (p) p.innerHTML = t.value.trim() ? `<img src="${esc(t.value.trim())}" alt="" onerror="this.remove()">` : ""; });
$("#crest").addEventListener("click", () => { if (++taps >= 5) { adminOn = true; tab = "admin"; render(true); } setTimeout(() => taps = 0, 2500); });

const seasonList = fmt => { const y = new Date().getFullYear(), out = []; for (let k = y + 1; k >= y - 20; k--) { if (!fmt || fmt === "year") out.push(String(k)); if (!fmt || fmt === "split") out.push(k + "/" + (k + 1)); } return out; };
const seasonFmt = i => { const r = i.closest(".rw"), c = r ? r.querySelector('[data-c="comp"],[data-c="name"]') : $('#sbody input[data-k="comp"]'); if (!c) { const lg = EDCOL === "table" ? lib("leagues", D.club.league) : null; return lg && lg.seasons ? (String(lg.seasons).startsWith("Split") ? "split" : "year") : ""; } const x = lib(c.dataset.c === "name" ? "trophies" : "leagues", c.value); return x && x.seasons ? (String(x.seasons).startsWith("Split") ? "split" : "year") : ""; };
const cbItems = (src, qry, el) => {
  if (src === "season") return seasonList(seasonFmt(el)).filter(n => n.includes(qry)).slice(0, 40);
  if (src === "places") return PLACES().filter(n => n.toLowerCase().includes(qry)).slice(0, 40);
  if (src === "stages") return stageList().filter(n => n.toLowerCase().includes(qry)).slice(0, 80);
  if (src === "countries") return qry ? COUNTRIES.filter(([c,n]) => n.toLowerCase().includes(qry)).slice(0, 8).map(([c,n]) => n) : [];
  if (src === "nations" && !L(D.nations).length) return COUNTRIES.map(c => c[1]).filter(n => n.toLowerCase().includes(qry)).slice(0, 40);
  return (src === "clubs" ? [D.club, ...L(D.clubs)] : L(D[src])).map(x => x.name).filter(Boolean).filter(n => n.toLowerCase().includes(qry)).sort((a,b) => a.localeCompare(b)).slice(0, 40);
};
function cbOpen(i, all){
  const src = i.dataset.src, box = i.nextElementSibling, r = cbItems(src, all ? "" : i.value.trim().toLowerCase(), i);
  box.innerHTML = r.map(n => `<div data-n="${esc(n)}">${ico(src, n)}${esc(n)}</div>`).join(""); box.hidden = !r.length;
  const f = i.parentElement.previousElementSibling?.querySelector?.(".cbf"); if (f) f.innerHTML = ico(src, i.value);
}
$("#sbody").addEventListener("input", e => { if (e.target.classList.contains("cbi")) cbOpen(e.target, false); });
$("#sbody").addEventListener("focusin", e => { if (e.target.classList.contains("cbi")) cbOpen(e.target, true); });
$("#sbody").addEventListener("click", e => { const d = e.target.closest(".cbl div"); if (!d) return;
  const i = d.parentElement.previousElementSibling; i.value = d.dataset.n; d.parentElement.hidden = true;
  if (i.dataset.src === "places" && i.dataset.k === "birthplace") placeFill(i, true);
  const f = i.parentElement.previousElementSibling?.querySelector?.(".cbf"); if (f) f.innerHTML = ico(i.dataset.src, i.value); });
$("#sbody").addEventListener("change", e => { const t = e.target; if (t.tagName === "SELECT" && t.dataset.k) t.dataset.tc = "1"; if (t.dataset && t.dataset.k === "birthplace") placeFill(t, false); edMark(); });
$("#sbody").addEventListener("input", edMark);
/* leading space: "Batumi Arena" is fine, " Batumi Arena" is flagged under the field */
const lspOk = e => e.tagName === "TEXTAREA" || (e.tagName === "INPUT" && /^(text)?$/i.test(e.getAttribute("type") || ""));
const lspScopeOf = e => e.closest(".rw") || e.closest(".ff");
const lspName = (e, rw) => { let t = rw ? (e.getAttribute("placeholder") || "") : (((e.closest(".ff") || {}).querySelector && e.closest(".ff").querySelector("label") || {}).textContent || "");
  t = t.replace(/\s+/g, " ").replace(/\s*\(.*?\)/g, "").replace(/,?\s*e\.g\..*$/i, "").trim(); return t.length > 26 ? t.slice(0, 25) + "…" : t || "Field"; };
function lspSync(scope){
  if (!scope) return; const rw = scope.classList.contains("rw");
  [...scope.querySelectorAll(".lsp")].filter(m => lspScopeOf(m) === scope).forEach(m => m.remove());
  const flagged = [];
  [...scope.querySelectorAll("input,textarea")].filter(e => lspScopeOf(e) === scope && lspOk(e)).forEach(e => {
    const bad = /^\s/.test(e.value); e.classList.toggle("lsp-bad", bad);
    if (bad) { e.setAttribute("aria-invalid", "true"); flagged.push(e); } else e.removeAttribute("aria-invalid"); });
  if (!flagged.length) return;
  const names = flagged.map(e => lspName(e, rw)), msg = rw ? esc(names.join(", ")) + (names.length > 1 ? " start" : " starts") + " with a space" : "Starts with a space";
  const html = `<div class="lsp" role="status"><span>${msg}</span><button type="button" onclick="lspFix(this)">Remove space</button></div>`;
  if (rw) scope.insertAdjacentHTML("beforeend", html); else { const f = flagged[0]; (f.closest(".cb") || f).insertAdjacentHTML("afterend", html); }
}
function lspCheck(el){ const s = el && el.closest && lspScopeOf(el); if (s && s.closest("#sbody")) lspSync(s); }
function lspScan(){ document.querySelectorAll("#sbody .ff, #sbody .rw").forEach(lspSync); }
function lspFix(b){
  const m = b.closest(".lsp"), s = m && lspScopeOf(m); if (!s) return;
  [...s.querySelectorAll("input,textarea")].filter(e => lspScopeOf(e) === s && lspOk(e) && /^\s/.test(e.value)).forEach(e => { e.value = e.value.replace(/^\s+/, ""); if (!e.classList.contains("cbi")) e.dispatchEvent(new Event("input", {bubbles:true})); });
  lspSync(s); edMark();
}
$("#sbody").addEventListener("input", e => lspCheck(e.target));
$("#sbody").addEventListener("click", () => setTimeout(edMark, 0));
document.addEventListener("click", e => { if (!e.target.closest(".cb")) document.querySelectorAll(".cbl").forEach(b => b.hidden = true); });
/* ===== render ===== */
function render(animate){
  $("#cname").textContent = (LANG === "ru" && D.club.name_ru) || D.club.name; $("#gear").setAttribute("aria-label", T("Settings"));
  $("#csub").textContent = `${lname("leagues", D.club.league)} · ${D.club.city}`;
  $("#crest").innerHTML = D.club.logo ? `<img src="${esc(D.club.logo)}" alt="">` : esc(D.club.short || "D");
  $("#nav").innerHTML = tabs().map(([k,l]) => `<button class="${k===tab?"on":""}"${k===tab?' aria-current="page"':""} onclick="go('${k}')">${ICON[k]}${T(l)}</button>`).join("");
  const main = $("#main");
  main.className = animate ? "anim" : "";
  main.innerHTML = loading ? '<div class="sk"></div><div class="sk" style="height:140px"></div><div class="sk"></div>'
    : {home:renderHome,matches:renderMatches,squad:renderSquad,table:renderTable,admin:renderAdmin}[tab]();
  document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
  if (animate) main.querySelectorAll(".card,.pc,.grp,.cg").forEach((el,i) => el.style.setProperty("--i", Math.min(i,9)));
  a11yTap(main); if (animate && !loading) enterAnim(main); tt();
}
/* ===== back-to-top (Matches tab) ===== */
var upBtn = document.createElement("button");
upBtn.type = "button"; upBtn.id = "totop"; upBtn.className = "totop"; upBtn.setAttribute("aria-label", "Back to top");
upBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
upBtn.onclick = () => scrollTo({top:0, behavior: RM ? "auto" : "smooth"});
document.body.appendChild(upBtn);
function tt(){ if (upBtn) upBtn.classList.toggle("show", tab === "matches" && scrollY > 700); }
addEventListener("scroll", tt, {passive:true});
function go(t){ if (t === tab) return; tab = t; const run = () => { render(true); scrollTo({top:0}); }; (document.startViewTransition && !RM) ? document.startViewTransition(run) : run(); }

/* ===== start ===== */
if (LIVE) {
  loading = true; render(true);
  firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
  firebase.auth().onAuthStateChanged(u => { authed = !!u; if (tab === "admin" && !sheet.classList.contains("open")) render(false); });
  db.ref("/").on("value", s => {
    D = {club:SAMPLE.club, players:{}, matches:{}, table:{}, leagues:{}, clubs:{}, nations:{}, trophies:{}, referees:{}, ...(s.val() || {})}; $("#srcnote").textContent = "";
    const was = loading; loading = false; if (!sheet.classList.contains("open") || was) render(was); if (was) deepOpen();
  });
  setTimeout(() => { if (loading) { loading = false; $("#srcnote").textContent = T("Couldn't reach the database. Showing sample data."); render(true); } }, 8000);
} else {
  $("#srcnote").textContent = T("Showing sample data. Add your Firebase config to go live.");
  if (adminOn) tab = "admin";
  render(true);
}
setInterval(() => { if (tab === "home" && !loading && !sheet.classList.contains("open")) render(false); }, 60000);
/* scroll-edge: header fades in a soft edge only once content is underneath it */
const onScroll = () => document.body.classList.toggle("scrolled", scrollY > 4);
addEventListener("scroll", onScroll, {passive:true}); onScroll();
/* iOS Safari only shows :active styles when a touch listener exists */
document.addEventListener("touchstart", () => {}, {passive:true});
</script>
<script>
/* ticks the next-match countdown every second (re-render still refreshes it each minute) */
setInterval(function(){if(document.hidden)return;var e=document.querySelector(".nxc[data-t]");if(!e)return;
 var ms=new Date(e.dataset.t)-Date.now(),c=e.children;if(ms<=0||c.length!==4)return;
 var v=[Math.floor(ms/864e5),Math.floor(ms/36e5)%24,Math.floor(ms/6e4)%60,Math.floor(ms/1e3)%60];
 for(var k=0;k<4;k++){var n=c[k].firstElementChild;if(n&&n.textContent!=v[k])n.textContent=v[k]}
 e.classList.remove("tick");void e.offsetWidth;e.classList.add("tick")},1000);
</script>
