<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Season analytics · Dinamo Batumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f4f3ee;--surface:#fdfcfa;--ink:#0c1020;--mut:#5d6170;--line:#dcdad2;--blue:#1432a6;--mark:#1432a6;--win:#13764a;--draw:#5f677b;--lose:#b3261e;--d:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--b:"Hanken Grotesk",system-ui,sans-serif;--pad:max(18px,env(safe-area-inset-left),env(safe-area-inset-right))}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--surface:#12151c;--ink:#ecedf1;--mut:#9aa1b1;--line:#262a36;--blue:#1a37b8;--mark:#8fa8ff;--win:#3ccf8e;--draw:#9aa1b1;--lose:#ff6b61}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 .9375rem/1.5 var(--b);min-height:100dvh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ink);padding:calc(8px + env(safe-area-inset-top)) var(--pad) 8px}
.hd{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;border-radius:8px;color:var(--ink);text-decoration:none}
.back svg,.sp svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font:800 1.5rem/1 var(--d);letter-spacing:.04em;text-transform:uppercase}
header small{display:block;color:var(--mut);font-size:.75rem;margin-top:2px}
main{max-width:680px;margin:0 auto;padding:0 var(--pad)}
select{width:100%;min-height:48px;margin-top:16px;padding:0 14px;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:6px;font:700 .9375rem var(--b)}
h2{margin:28px 0 10px;font:700 .75rem var(--d);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tiles div{padding:12px 8px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tiles div:nth-child(3n){border-right:0}.tiles div:nth-child(n+4){border-bottom:0}
.tiles b{display:block;font:800 1.75rem/1 var(--d);font-variant-numeric:tabular-nums}
.tiles span{font-size:.75rem;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.ch text{fill:var(--mut);font:600 10px var(--b)}
.lg{display:flex;gap:14px;margin-top:8px;font-size:.75rem;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split b{display:block;font:800 1.25rem var(--d);letter-spacing:.06em;text-transform:uppercase}
.split p{color:var(--mut);font-size:.8125rem;margin-top:4px}
.bar{height:8px;border-radius:4px;display:flex;overflow:hidden;margin-top:10px;background:var(--line)}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.rk:last-child{border:0}
.rk>span:first-child{width:22px;font:800 1.1rem var(--d);color:var(--mut)}
.rk>span:nth-child(2){flex:1;min-width:0}.rk small{display:block;color:var(--mut);font-size:.75rem}
.rk b{font:800 1.25rem var(--d);font-variant-numeric:tabular-nums}
.empty{padding:40px 0;text-align:center;color:var(--mut);font:600 .8125rem var(--d);letter-spacing:.16em;text-transform:uppercase}
@keyframes sh{to{background-position:-200% 0}}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sk{height:96px;margin-top:14px;border-radius:10px;background:linear-gradient(100deg,color-mix(in srgb,var(--ink) 7%,transparent) 30%,color-mix(in srgb,var(--ink) 15%,transparent) 50%,color-mix(in srgb,var(--ink) 7%,transparent) 70%) 0 0/200% 100%;animation:sh 1.25s linear infinite}
.in>*{animation:up .35s both}.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(n+4){animation-delay:.15s}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.in>*{animation:none}}
dialog{border:1px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,400px);margin:auto}
dialog::backdrop{background:#0009}
dialog h3{font:800 1.25rem var(--d);letter-spacing:.04em;text-transform:uppercase}
dialog p{color:var(--mut);font-size:.8125rem;margin:6px 0 12px}
dialog input{width:100%;min-height:48px;padding:0 12px;font:400 16px var(--b);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
dialog input:focus{outline:2px solid var(--mark);outline-offset:1px}
.dbt{display:flex;gap:8px;margin-top:14px}
.dbt button{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--ink);background:none;color:var(--ink);font:700 .875rem var(--b);cursor:pointer}
.dbt button.p{background:var(--ink);color:var(--bg)}
</style></head><body>
<header><div class="hd"><a class="back" id="back" href="dinamo-batumi-111.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a><div><h1 id="ttl">Season analytics</h1><small id="sub">Dinamo Batumi</small></div></div></header>
<main id="main"><div class="sk"></div><div class="sk" style="height:180px"></div><div class="sk"></div></main>
<dialog id="cfg"><h3>Back button link</h3><p>Where the back arrow goes. Saved for everyone, on every device. Leave empty for the default.</p><input id="bkin" type="url" inputmode="url" autocapitalize="off" placeholder="https://… or page.html"><div id="au" hidden style="margin-top:10px"><p style="margin:0 0 6px">Admin sign-in</p><input id="bkem" type="email" autocomplete="username" autocapitalize="off" placeholder="Email"><input id="bkpw" type="password" autocomplete="current-password" placeholder="Password" style="margin-top:8px"></div><p id="bkerr" style="color:var(--lose);margin:8px 0 0"></p><div class="dbt"><button id="bkx">Cancel</button><button id="bkreset">Reset</button><button class="p" id="bksave">Save</button></div></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const FIREBASE_CONFIG = { apiKey:"AIzaSyAakV_rFhfgQRh1w0srdpX8ArdNxLPlOP4", authDomain:"dinamo-batumi-perla.firebaseapp.com", databaseURL:"https://dinamo-batumi-perla-default-rtdb.europe-west1.firebasedatabase.app", projectId:"dinamo-batumi-perla", storageBucket:"dinamo-batumi-perla.firebasestorage.app", messagingSenderId:"252337389242", appId:"1:252337389242:web:f9226ed316f733699f8c83" };
const $ = s => document.querySelector(s), KEY = n => String(n ?? "").trim().toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = o => !o ? [] : (Array.isArray(o) ? o.map((v,i)=>v&&({id:String(i),...v})).filter(Boolean) : Object.entries(o).map(([id,v])=>({id,...v})));
const rk = id => String(id).replace(/[.0\[\]\/]/g, "_");
let D = null, SEL = "";
const syr = x => (String(x ?? "").match(/\d{4}/) || [""])[0];
const seasonOf = m => m.season ? String(m.season) : (isNaN(new Date(m.date)) ? "" : String(new Date(m.date).getFullYear()));
const gkey = m => KEY(m.comp) + "|" + (syr(seasonOf(m)) || "–");

function groups(){ const me = KEY(D.club.name), mp = new Map();
  L(D.matches).filter(m => m.status === "FT" && (KEY(m.home) === me || KEY(m.away) === me)).forEach(m => { const k = gkey(m), g = mp.get(k) || {key:k, label:[m.comp || "No competition", seasonOf(m)].filter(Boolean).join(" · "), ms:[], last:0};
    g.ms.push(m); g.last = Math.max(g.last, +new Date(m.date) || 0); mp.set(k, g); });
  return [...mp.values()].sort((a, b) => b.last - a.last); }

function view(){
  const gs = groups(), main = $("#main"); if (!gs.length) { main.innerHTML = '<div class="empty">No played matches yet</div>'; return; }
  const g = gs.find(x => x.key === SEL) || gs[0], me = KEY(D.club.name);
  const ms = g.ms.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  const r = ms.map(m => { const h = KEY(m.home) === me, f = +(h ? m.hs : m.as) || 0, a = +(h ? m.as : m.hs) || 0; return {m, h, f, a, p:f > a ? 3 : f === a ? 1 : 0}; });
  const sum = (x, k) => x.reduce((t, y) => t + y[k], 0), W = r.filter(x => x.p === 3).length, Dr = r.filter(x => x.p === 1).length, Lo = r.length - W - Dr;
  const split = x => ({n:x.length, pts:sum(x, "p"), f:sum(x, "f"), a:sum(x, "a")}), H = split(r.filter(x => x.h)), A = split(r.filter(x => !x.h));
  /* goals per match: scored (up) vs conceded (down) */
  const w = 320, ht = 150, mid = 80, mx = Math.max(3, ...r.map(x => Math.max(x.f, x.a))), bw = Math.min(22, (w - 20) / r.length - 4), sx = i => 10 + (i + .5) * ((w - 20) / r.length), sc = 62 / mx;
  const bars = r.map((x, i) => '<rect x="' + (sx(i) - bw / 2) + '" y="' + (mid - x.f * sc) + '" width="' + bw + '" height="' + Math.max(x.f * sc, 1) + '" rx="2" fill="var(--win)"/><rect x="' + (sx(i) - bw / 2) + '" y="' + mid + '" width="' + bw + '" height="' + Math.max(x.a * sc, 1) + '" rx="2" fill="var(--lose)"/>').join("");
  /* points over the season */
  let c = 0; const pts = r.map(x => c += x.p), pm = Math.max(3, c), py = v => 118 - v / pm * 100, line = pts.map((v, i) => (i ? "L" : "M") + sx(i).toFixed(1) + " " + py(v).toFixed(1)).join(" ");
  /* best rated players */
  const pl = L(D.players), rt = new Map();
  r.forEach(x => Object.entries(x.m.ratings || {}).forEach(([id, v]) => { v = parseFloat(v); if (!isNaN(v)) { const e = rt.get(id) || {s:0, n:0}; e.s += v; e.n++; rt.set(id, e); } }));
  const top = [...rt.entries()].map(([id, e]) => ({p:pl.find(p => rk(p.id) === id), avg:e.s / e.n, n:e.n})).filter(x => x.p && x.n >= Math.min(3, r.length)).sort((a, b) => b.avg - a.avg).slice(0, 5);
  const side = (t, x) => '<div class="card"><b>' + t + '</b><p>' + x.n + ' played · ' + x.pts + ' pts</p><p>' + x.f + ' scored, ' + x.a + ' conceded</p><div class="bar"><i style="width:' + (x.n ? x.pts / (x.n * 3) * 100 : 0) + '%;background:var(--mark)"></i></div></div>';
  main.innerHTML = '<select id="sel" aria-label="Tournament and season">' + gs.map(x => '<option value="' + esc(x.key) + '"' + (x.key === g.key ? " selected" : "") + '>' + esc(x.label) + '</option>').join("") + '</select>'
  + '<div class="in"><div class="tiles"><div><b>' + r.length + '</b><span>Played</span></div><div><b style="color:var(--win)">' + W + '</b><span>Wins</span></div><div><b>' + Dr + '</b><span>Draws</span></div><div><b style="color:var(--lose)">' + Lo + '</b><span>Losses</span></div><div><b>' + sum(r, "f") + '–' + sum(r, "a") + '</b><span>Goals</span></div><div><b>' + sum(r, "p") + '</b><span>Points</span></div></div>'
  + '<div><h2>Goals per match</h2><div class="card"><svg class="ch" viewBox="0 0 ' + w + ' ' + ht + '"><line x1="10" x2="' + (w - 10) + '" y1="' + mid + '" y2="' + mid + '" stroke="var(--line)"/>' + bars + '</svg><div class="lg"><span><i style="background:var(--win)"></i>Scored</span><span><i style="background:var(--lose)"></i>Conceded</span></div></div></div>'
  + '<div><h2>Points race</h2><div class="card"><svg class="ch" viewBox="0 0 ' + w + ' 130"><path d="' + line + '" fill="none" stroke="var(--mark)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + pts.map((v, i) => '<circle cx="' + sx(i).toFixed(1) + '" cy="' + py(v).toFixed(1) + '" r="3" fill="var(--mark)"/>').join("") + '<text x="10" y="128">1st match</text><text x="' + (w - 10) + '" y="128" text-anchor="end">' + c + ' pts</text></svg></div></div>'
  + '<div><h2>Home vs away</h2><div class="split">' + side("Home", H) + side("Away", A) + '</div></div>'
  + (top.length ? '<div><h2>Best rated</h2><div class="card">' + top.map((x, i) => '<div class="rk"><span>' + (i + 1) + '</span><span><b style="font:600 .9375rem var(--b)">' + esc(x.p.name) + '</b><small>' + x.n + ' rated matches</small></span><b>' + x.avg.toFixed(2) + '</b></div>').join("") + '</div></div>' : "") + '</div>';
  $("#sel").onchange = e => { SEL = e.target.value; view(); };
  $("#sub").textContent = D.club.name + " · " + g.label;
}

firebase.initializeApp(FIREBASE_CONFIG);
firebase.database().ref("/").on("value", s => { D = {club:{name:"Dinamo Batumi"}, players:{}, matches:{}, ...(s.val() || {})}; syncBack(); view(); });
setTimeout(() => { if (!D) $("#main").innerHTML = '<div class="empty">Couldn’t reach the database</div>'; }, 8000);

/* hidden setting: tap the title 5 times to choose where the back button leads. Saved in the database, so it is the same on every device. */
const DEF = "dinamo-batumi-111.html", urlOk = u => !/^\s*(javascript|data|vbscript):/i.test(u);
const backUrl = () => { const v = String((D && D.club && D.club.backUrl) || "").trim(); return v && urlOk(v) ? v : DEF; };
const syncBack = () => { $("#back").href = backUrl(); };
let taps = 0, tm; $("#ttl").addEventListener("click", () => { clearTimeout(tm); tm = setTimeout(() => taps = 0, 2500); if (++taps >= 5) { taps = 0; const v = (D && D.club && D.club.backUrl) || ""; $("#bkin").value = v; $("#bkerr").textContent = ""; $("#cfg").showModal(); } });
firebase.auth().onAuthStateChanged(u => { $("#au").hidden = !!u; });
async function bkSave(reset){ const v = reset ? "" : $("#bkin").value.trim(), er = $("#bkerr"); er.textContent = "";
  if (v && !urlOk(v)) { er.textContent = "That link isn't allowed"; return; }
  try { if (!firebase.auth().currentUser) await firebase.auth().signInWithEmailAndPassword($("#bkem").value, $("#bkpw").value);
    await firebase.database().ref("club/backUrl").set(v); $("#cfg").close(); }
  catch (e) { er.textContent = e.code === "PERMISSION_DENIED" ? "Not allowed. Sign in as admin." : e.message; } }
$("#bksave").onclick = () => bkSave(false); $("#bkreset").onclick = () => bkSave(true); $("#bkx").onclick = () => $("#cfg").close();
</script></body></html>
