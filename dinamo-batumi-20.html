<style>
:root{--bg:#f3f0e8;--card:#faf8f2;--ink:#15181d;--mut:#666a72;--line:#d8d3c6;--ac:#1b3fa8;--on:#fff;--win:#1d7447;--lose:#b3261e;--draw:#80838a;--pitch:#2c5a3c;--pl:#ffffff55;--d:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif}

/* ===== views ===== */
function matchRow(m){
  const r = res(m), sc = played(m) ? `${m.hs} - ${m.as}` : fmtTime(m.date);
  return `<div class="mrow tap" onclick="openMatch('${esc(m.id)}')">
    <div class="date"><b>${fmtDay(m.date)}</b>${fmtMon(m.date)}</div>
    <div class="t"><div>${badge(m.home)}${tn(m.home)}</div><div>${badge(m.away)}${tn(m.away)}</div></div>
    <div class="sc ${r}">${sc}</div>${r ? `<span class="pill ${r}">${RLET(r)}</span>` : '<span class="chev">→</span>'}</div>`;
}

function renderHome(){
  const all = matches(), done = all.filter(played), next = all.find(m => !played(m)), last = done[done.length-1];
  const form = done.slice(-5).map((m,i) => `<span class="pill ${res(m)}" style="--i:${i}">${RLET(res(m))}</span>`).join(" ");
  const top = L(D.players).sort((a,b) => goalsNow(b)-goalsNow(a))[0];
  return `
  ${next ? `<div class="card hero big tap" onclick="openMatch('${esc(next.id)}')"><span class="chip">${compHtml(next.comp)}</span>${stageLine(next)}
    <div class="teams"><div class="tm">${badge(next.home)}${tn(next.home)}</div><div class="mut">VS</div><div class="tm">${badge(next.away)}${tn(next.away)}</div></div>
    <div class="sm mut">${fmtDate(next.date)} · ${fmtTime(next.date)} · ${esc(next.venue||"")}</div><div class="count">${T("Kick-off")} ${until(next.date)}</div></div>` : ""}
  ${last ? `<div class="card"><h2>${T("Latest result")}</h2>${matchRow(last)}</div>` : ""}
  ${form ? `<div class="card"><h2>${T("Form")}</h2><div class="row">${form}</div></div>` : ""}
  ${top && goalsNow(top) ? `<div class="card"><h2>${T("Top scorer")}</h2><div class="row tap" onclick="openPlayer('${esc(top.id)}')">${avatar(top)}<div><b>${flag(top.nationality)}${esc(pname(top))}</b><div class="sm mut">${goalsNow(top)} ${T("goals")}</div></div></div></div>` : ""}
  <div class="card"><h2>${T("Club")}</h2><div class="sm"><div>${esc(D.club.stadium)}, ${esc(D.club.city)}</div><div class="mut">${T("Founded")} ${esc(D.club.founded)} · ${T("Coach")}: ${esc(D.club.coach)}</div></div></div>`;
}
function renderMatches(){
  const all = matches(); if (!all.length) return `<div class="card"><div class="empty">${T("No results yet")}</div></div>`;
  const cg = new Map();
  all.forEach(m => { const se = seasonOf(m), k = KEY(m.comp) + "|" + se, g = cg.get(k) || {comp:m.comp, season:se, st:new Map(), last:0},
    t = +new Date(m.date) || 0, sk = KEY(m.stage), e = g.st.get(sk) || {stage:m.stage || "", ms:[], last:0};
    e.ms.push(m); e.last = Math.max(e.last, t); g.last = Math.max(g.last, t); g.st.set(sk, e); cg.set(k, g); });
  return [...cg.values()].sort((a,b) => b.last - a.last).map(g =>
    `<div class="cg"${g.comp ? lgOn(g.comp) : ""}>${g.comp ? compHtml(g.comp) : T("No competition")}${g.season ? ` <span class="mut">${esc(g.season)}</span>` : ""}</div>`
    + [...g.st.values()].sort((a,b) => b.last - a.last).map(e => (e.stage ? `<div class="sg">${esc(stg(e.stage))}</div>` : "") + `<div>${e.ms.map(matchRow).join("")}</div>`).join("")).join("");
}

/* ===== sheet (slide-up, swipe down to close) ===== */
const sheet = $("#sheet"), pn = $("#pn");
function openSheet(html){ $("#sbody").innerHTML = html; pn.scrollTop = 0; pn.style.transform = ""; sheet.classList.add("open"); document.body.style.overflow = "hidden"; buzz(); }
let vstack = [], vcur = null;
const pushView = f => { if (sheet.classList.contains("open") && vcur) vstack.push(vcur); vcur = f; };
const backBtn = () => vstack.length ? `<button class="back" onclick="goBack()">← ${LANG === "ru" ? "Назад" : "Back"}</button>` : "";
function goBack(){ const f = vstack.pop(); vcur = null; if (f) f(); }
function closeSheet(){ vstack = []; vcur = null; sheet.classList.remove("open","drag"); pn.style.transform = ""; document.body.style.overflow = ""; }
addEventListener("keydown", e => e.key === "Escape" && closeSheet());
let y0 = null, dy = 0;
pn.addEventListener("touchstart", e => { if (pn.scrollTop <= 0 && e.touches[0].clientY - pn.getBoundingClientRect().top <= 56) { y0 = e.touches[0].clientY; dy = 0; } }, {passive:true});
pn.addEventListener("touchmove", e => {
  if (y0 === null) return; dy = e.touches[0].clientY - y0;
  if (dy > 0) { sheet.classList.add("drag"); pn.style.transform = `translateY(${dy}px)`; } else dy = 0;
}, {passive:true});
pn.addEventListener("touchend", () => { if (y0 === null) return; y0 = null; sheet.classList.remove("drag"); dy > 110 ? closeSheet() : (pn.style.transform = ""); });

function countUp(root){
  root.querySelectorAll("[data-n]").forEach(el => {
    const n = +el.dataset.n || 0; if (RM || !n) { el.textContent = n; return; }
    const t0 = performance.now();
    (function f(t){ const k = Math.min((t - t0)/700, 1); el.textContent = Math.round(n * (1 - Math.pow(1-k,3))); if (k < 1) requestAnimationFrame(f); })(t0);
  });
}
const statsOf = p => {
  const out = lines(p.stats).map(l => { const a = l.split(",").map(x => x.trim()); return {season:a[0]||"", comp:a[1]||"", apps:+a[2]||0, a:+a[3]||0, b:+a[4]||0, y:+a[5]||0, r:+a[6]||0, club:a[7]||""}; });
  if (!out.length && (p.apps||p.goals||p.assists||p.cleansheets||p.conceded)) { const g = grp(p) === "GK";
    out.push({season:"", comp:"", apps:+p.apps||0, a:g ? +p.cleansheets||0 : +p.goals||0, b:g ? +p.conceded||0 : +p.assists||0, y:0, r:0}); }
  return out.reverse();
};
const statLabel = r => [r.season, r.comp].filter(Boolean).join(" · ") || T("Season");
const statText = r => [r.season, r.comp ? lname("leagues", r.comp) : "", r.club ? lname("clubs", r.club) : ""].filter(Boolean).join(" · ") || T("Season");
const statChip = r => (r.comp ? logoImg("leagues", r.comp) : "") + (r.club ? logoImg("clubs", r.club) : "") + esc(statText(r));
function ddToggle(){ const d = $("#ssel"); if (!d) return; const l = d.querySelector(".ddl"); l.hidden = !l.hidden; d.classList.toggle("open", !l.hidden); }
document.addEventListener("click", e => { if (e.target.closest(".dd")) return; const d = $("#ssel"); if (d) { d.querySelector(".ddl").hidden = true; d.classList.remove("open"); } });
const goalsNow = p => { if (grp(p) === "GK") return 0; const ls = statsOf(p); if (!ls.length) return 0; const s = ls[0].season; return ls.filter(r => r.season === s).reduce((t,r) => t + r.a, 0); };
const clubKey = r => KEY(r.club || D.club.name), clubName = r => r.club || D.club.name;
function statGroups(p){ const m = new Map(); statsOf(p).forEach(r => { const k = clubKey(r) + "|" + KEY(r.season), g = m.get(k) || {club:clubName(r), season:r.season, lines:[], ...Z()}; g.lines.push(r); m.set(k, {...g, ...addS(g, r)}); }); return [...m.values()]; }
const groupText = g => [g.season, lname("clubs", g.club)].filter(Boolean).join(" · ") || T("Season");
const groupChip = g => logoImg("clubs", g.club) + esc(groupText(g));
const clubLabel = n => `<span class="tn">${logoImg("clubs", n)}${esc(lname("clubs", n))}</span>`;
const compLabel = c => c ? `<span class="tn">${logoImg("leagues", c)}${esc(lname("leagues", c))}</span>` : `<span class="mut">${T("No competition")}</span>`;
function bdBlock(p, i){
  const gs = statGroups(p); let rows;
  if (i === "all") { const m = new Map(); gs.forEach(g => { const k = KEY(g.club), e = m.get(k) || {html:clubLabel(g.club), ...Z()}; m.set(k, {...e, ...addS(e, g)}); }); rows = [...m.values()]; }
  else rows = ((gs[i] || {}).lines || []).map(l => ({...l, html:compLabel(l.comp)}));
  return rows.length > 1 ? `<button type="button" class="bdb" onclick="bdToggle(this)">${T(i === "all" ? "By club" : "By competition")}<i class="car"></i></button><div class="bdt" hidden>${statTable(rows, grp(p) === "GK", false)}</div>` : "";
}
function bdToggle(b){ const t = b.nextElementSibling; t.hidden = !t.hidden; b.classList.toggle("open", !t.hidden); }
function toggleSub(tr){ const o = !tr.classList.contains("open"); tr.classList.toggle("open", o); for (let n = tr.nextElementSibling; n && n.classList.contains("sub"); n = n.nextElementSibling) n.hidden = !o; }
function statRow(p, i){
  const gs = statGroups(p), r = i === "all" ? gs.reduce(addS, Z()) : (gs[i] || Z());
  const n = (v,l) => `<div><b data-n="${+v||0}">0</b><span>${T(l)}</span></div>`;
  return grp(p) === "GK" ? n(r.apps,"Apps") + n(r.a,"Clean sheets") + n(r.b,"Goals conceded") + n(r.y,"Yellow cards") + n(r.r,"Red cards") : n(r.apps,"Apps") + n(r.a,"Goals") + n(r.b,"Assists") + n(r.y,"Yellow cards") + n(r.r,"Red cards");
}
function statTab(id, i){
  const p = L(D.players).find(x => x.id === id); if (!p) return;
  $("#stg").innerHTML = statRow(p, i); countUp($("#stg"));
  const bw = $("#bdw"); if (bw) { const was = bw.querySelector(".bdt") && !bw.querySelector(".bdt").hidden; bw.innerHTML = bdBlock(p, i); if (was) { const b = bw.querySelector(".bdb"); if (b) bdToggle(b); } }

function renderAdmin(){
  if (!authed) return `<div class="card fm"><h2>Admin sign in</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="btns"><button class="btn" onclick="login()">Sign in</button></div></div>`;
  const list = (col, items, line, title) => sec(col, title || col, items.length, `<button class="btn alt" onclick="${stop}editItem('${col}')">+ Add</button>`, `${items.map(x => `<div class="arow tap" onclick="editItem('${col}','${esc(x.id)}')">${line(x)}<span class="chev">→</span></div>`).join("") || '<div class="empty">Nothing yet</div>'}`);
  return `${LIVE ? "" : '<div class="hint">Local mode: edits are not saved. Add FIREBASE_CONFIG to go live.</div>'}
  ${sec("club", "Our club", null, `<button class="btn alt" onclick="${stop}editItem('club')">Edit</button>`, '<div class="hint">Renaming the club also updates matches, the table and player stats.</div>')}
  ${list("leagues", L(D.leagues).sort(byName), x => `<span>${th(x.logo)}${esc(x.name)} <span class="mut">${esc(x.country||"")}</span></span>`, "Leagues & cups")}
  ${list("clubs", L(D.clubs).sort(byName), x => `<span>${th(x.logo)}${esc(x.name)} <span class="mut">${esc(x.league||"")}</span></span>`, "Other clubs")}
  ${list("nations", L(D.nations).sort(byName), x => `<span>${th(x.logo)}${esc(x.name)}</span>`, "National teams")}
  ${list("trophies", L(D.trophies).sort(byName), x => `<span>${th(x.image)}${esc(x.name)} <span class="mut">${esc(x.kind||"")}</span></span>`, "Trophies")}
  ${list("players", L(D.players).sort((a,b)=>(a.number||99)-(b.number||99)), p => `<span><b>${esc(p.number??"")}</b> ${esc(p.name)} <span class="mut">${esc(p.pos)}</span></span>`)}
  ${list("matches", matches().reverse(), m => `<span>${fmtDate(m.date)}: ${esc(m.home)} v ${esc(m.away)} <span class="mut">${esc(m.stage||"")}</span></span>`)}
  ${list("table", L(D.table), t => `<span>${esc(t.team)} <span class="mut">${t.pts} pts</span></span>`)}
  <div class="btns"><button class="btn alt" onclick="exportJSON()">Export backup</button>${LIVE ? '<button class="btn alt" onclick="seed()">Load sample data</button><button class="btn alt" onclick="firebase.auth().signOut()">Sign out</button>' : ""}</div>`;
}
$("#crest").addEventListener("click", () => { if (++taps >= 5) { adminOn = true; tab = "admin"; render(true); } setTimeout(() => taps = 0, 2500); });

const seasonList = fmt => { const y = new Date().getFullYear(), out = []; for (let k = y + 1; k >= y - 20; k--) { if (!fmt || fmt === "year") out.push(String(k)); if (!fmt || fmt === "split") out.push(k + "/" + (k + 1)); } return out; };
const seasonFmt = i => { const r = i.closest(".rw"), c = r ? r.querySelector('[data-c="comp"],[data-c="name"]') : $('#sbody input[data-k="comp"]'); if (!c) return ""; const x = lib(c.dataset.c === "name" ? "trophies" : "leagues", c.value); return x && x.seasons ? (String(x.seasons).startsWith("Split") ? "split" : "year") : ""; };
const cbItems = (src, qry, el) => {
  if (src === "season") return seasonList(seasonFmt(el)).filter(n => n.includes(qry)).slice(0, 40);
  if (src === "stages") return stageList().filter(n => n.toLowerCase().includes(qry)).slice(0, 80);
  if (src === "countries") return qry ? COUNTRIES.filter(([c,n]) => n.toLowerCase().includes(qry)).slice(0, 8).map(([c,n]) => n) : [];
  if (src === "nations" && !L(D.nations).length) return COUNTRIES.map(c => c[1]).filter(n => n.toLowerCase().includes(qry)).slice(0, 40);
  return (src === "clubs" ? [D.club, ...L(D.clubs)] : L(D[src])).map(x => x.name).filter(Boolean).filter(n => n.toLowerCase().includes(qry)).sort((a,b) => a.localeCompare(b)).slice(0, 40);
};
function cbOpen(i, all){
  const src = i.dataset.src, box = i.nextElementSibling, r = cbItems(src, all ? "" : i.value.trim().toLowerCase(), i);
  box.innerHTML = r.map(n => `<div data-n="${esc(n)}">${ico(src, n)}${esc(n)}</div>`).join(""); box.hidden = !r.length;
  const f = i.parentElement.previousElementSibling?.querySelector?.(".cbf"); if (f) f.innerHTML = ico(src, i.value);
}
$("#sbody").addEventListener("input", e => { if (e.target.classList.contains("cbi")) cbOpen(e.target, false); });
$("#sbody").addEventListener("focusin", e => { if (e.target.classList.contains("cbi")) cbOpen(e.target, true); });
$("#sbody").addEventListener("click", e => { const d = e.target.closest(".cbl div"); if (!d) return;
  const i = d.parentElement.previousElementSibling; i.value = d.dataset.n; d.parentElement.hidden = true;
  const f = i.parentElement.previousElementSibling?.querySelector?.(".cbf"); if (f) f.innerHTML = ico(i.dataset.src, i.value); });
document.addEventListener("click", e => { if (!e.target.closest(".cb")) document.querySelectorAll(".cbl").forEach(b => b.hidden = true); });
/* ===== render ===== */
function render(animate){
  $("#cname").textContent = (LANG === "ru" && D.club.name_ru) || D.club.name; $("#gear").setAttribute("aria-label", T("Settings"));
  $("#csub").textContent = `${lname("leagues", D.club.league)} · ${D.club.city}`;
  $("#crest").innerHTML = D.club.logo ? `<img src="${esc(D.club.logo)}" alt="">` : esc(D.club.short || "D");
  $("#nav").innerHTML = tabs().map(([k,l]) => `<button class="${k===tab?"on":""}" onclick="go('${k}')">${ICON[k]}${T(l)}</button>`).join("");
  const main = $("#main");
  main.className = animate ? "anim" : "";
  main.innerHTML = loading ? '<div class="sk"></div><div class="sk" style="height:140px"></div><div class="sk"></div>'
    : {home:renderHome,matches:renderMatches,squad:renderSquad,table:renderTable,admin:renderAdmin}[tab]();
  if (animate) main.querySelectorAll(".card,.pc,.grp,.cg").forEach((el,i) => el.style.setProperty("--i", Math.min(i,9)));
}
function go(t){ if (t === tab) return; tab = t; buzz(); render(true); scrollTo({top:0}); }

/* ===== start ===== */
if (LIVE) {
  loading = true; render(true);
  firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
  firebase.auth().onAuthStateChanged(u => { authed = !!u; if (tab === "admin" && !sheet.classList.contains("open")) render(false); });
  db.ref("/").on("value", s => {
    D = {club:SAMPLE.club, players:{}, matches:{}, table:{}, leagues:{}, clubs:{}, nations:{}, trophies:{}, ...(s.val() || {})}; $("#srcnote").textContent = "";
    const was = loading; loading = false; if (!sheet.classList.contains("open") || was) render(was);
  });
  setTimeout(() => { if (loading) { loading = false; $("#srcnote").textContent = T("Couldn't reach the database. Showing sample data."); render(true); } }, 8000);
} else {
  $("#srcnote").textContent = T("Showing sample data. Add your Firebase config to go live.");
  if (adminOn) tab = "admin";
  render(true);
}
setInterval(() => { if (tab === "home" && !loading && !sheet.classList.contains("open")) render(false); }, 60000);
</script>
</body>
</html>
