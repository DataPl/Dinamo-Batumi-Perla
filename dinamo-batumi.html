<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>Dinamo Batumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0e8;--card:#faf8f2;--ink:#15181d;--mut:#666a72;--line:#d8d3c6;--ac:#1b3fa8;--on:#fff;--win:#1d7447;--lose:#b3261e;--draw:#80838a;--pitch:#2c5a3c;--pl:#ffffff55;--d:"Barlow Condensed","Arial Narrow",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#111316;--card:#171a1e;--ink:#ecebe5;--mut:#9a9da4;--line:#2b2f35;--ac:#7a9bff;--on:#0d1018;--win:#4cc38a;--lose:#ff7a70;--draw:#8b8e95;--pitch:#1f4430}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:78px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:6;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;gap:12px;align-items:center;background:var(--bg);border-bottom:2px solid var(--ink)}
.crest{width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font:700 15px var(--d);letter-spacing:.04em;color:var(--on);overflow:hidden;flex:none}
.crest img{width:100%;height:100%;object-fit:cover}
header h1{font:700 24px/1 var(--d);text-transform:uppercase;letter-spacing:.02em}
header small{color:var(--mut);font-size:13px}
main{max-width:680px;margin:0 auto;padding:8px 18px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim .card,.anim .pc,.anim .grp{animation:rise .3s ease both;animation-delay:calc(var(--i,0)*30ms)}
.card{padding:18px 0 6px;border-bottom:1px solid var(--line)}
.card h2,.grp{font:600 13px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.grp{margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.hero{padding:20px 0 20px;border-bottom:2px solid var(--ink)}
.chip{font:600 13px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding-bottom:12px}.mut{color:var(--mut)}.sm{font-size:13px}
.tap{cursor:pointer;user-select:none;transition:background .15s}
@media(hover:hover){.tap:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}}
.tap:active{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.mrow{display:flex;align-items:center;gap:14px;padding:12px 6px;margin:0 -6px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.date{width:40px;font:600 12px/1.1 var(--d);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.date b{display:block;color:var(--ink);font-size:26px;letter-spacing:0}
.t{flex:1;min-width:0}.t div{display:flex;align-items:center;gap:9px;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bd{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 10px var(--d);letter-spacing:.03em;flex:none;border:1.5px solid var(--ink);color:var(--ink)}
.bd.me{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sc{font:700 24px var(--d);min-width:62px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sc.W{color:var(--win)}.sc.L{color:var(--lose)}
.pill{width:26px;height:26px;display:inline-grid;place-items:center;font:700 14px var(--d);color:#fff;border-radius:3px}
.W.pill{background:var(--win)}.L.pill{background:var(--lose)}.D.pill{background:var(--draw)}
.row .pill+.pill{margin-left:-6px}
.chev{color:var(--mut);width:14px;text-align:center}
.big{text-align:left}
.teams{display:flex;align-items:center;margin:14px 0 10px;gap:10px}
.teams .tm{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font:700 24px/1.05 var(--d);text-transform:uppercase}
.teams .tm:last-child{align-items:flex-end;text-align:right}
.teams .bd{width:44px;height:44px;font-size:16px}
.teams .mut,.score{font:600 16px var(--d);letter-spacing:.1em}
.score{font-size:44px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.count{font:600 15px var(--d);letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-top:10px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.pc{border-bottom:1px solid var(--line);padding:10px 4px;display:flex;gap:12px;align-items:center;min-width:0}
.av{width:42px;flex:none;font:700 30px/1 var(--d);color:var(--ac);overflow:hidden;font-variant-numeric:tabular-nums}
.av img{width:42px;height:42px;object-fit:cover;border-radius:50%;display:block}
.pc b{display:block;font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc>div:last-child{min-width:0}
.val{display:block;margin-top:1px;font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font:600 12px var(--d);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:center;padding:8px 3px;border-bottom:2px solid var(--ink)}
td{padding:11px 3px;text-align:center;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.me td{font-weight:700;color:var(--ac)}tr.me td:first-child{box-shadow:inset 3px 0 var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--ink);display:flex;padding:0 6px env(safe-area-inset-bottom);z-index:8}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px 9px;font:600 13px var(--d);letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square}
nav button.on{color:var(--ink)}
nav button.on:after{content:"";position:absolute;top:-2px;left:22%;right:22%;height:4px;background:var(--ac)}
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden;pointer-events:none}
.sheet.open{visibility:visible;pointer-events:auto}
.sheet .bg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .25s}
.sheet.open .bg{opacity:.5}
.sheet .pn{position:absolute;bottom:0;left:0;right:0;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-top:3px solid var(--ink);padding:8px 18px calc(28px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open .pn{transform:none}.sheet.drag .pn{transition:none}
.grab{width:36px;height:4px;background:var(--line);margin:4px auto 14px}
.x{position:absolute;right:14px;top:16px;background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer}
.pn h3{font:700 32px/1 var(--d);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;border-top:1px solid var(--line)}
.grid div{padding:12px 4px;border-bottom:1px solid var(--line)}
.grid b{display:block;font:700 26px/1.1 var(--d);font-variant-numeric:tabular-nums}.grid span{font-size:12px;color:var(--mut)}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.ev:first-of-type{border-top:0}.ev b{width:38px;font:700 20px var(--d);color:var(--ac)}
.ev em{font:600 12px var(--d);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--mut);margin-right:8px}
.pitch{position:relative;height:440px;background:var(--pitch);margin:8px 0;overflow:hidden}
.pitch .ln{position:absolute;border:1.5px solid var(--pl)}
.pitch .mid{left:0;right:0;top:50%}
.pitch .cc{left:50%;top:50%;width:80px;height:80px;margin:-40px;border-radius:50%}
.pitch .bx{left:25%;right:25%;height:14%}.pitch .bx.t{top:0;border-top:0}.pitch .bx.b{bottom:0;border-bottom:0}
.dot{position:absolute;transform:translate(-50%,-50%);text-align:center;width:66px}
.dot i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:#15181d;font:700 17px var(--d);margin:0 auto 3px;font-style:normal}
.dot small{display:block;font:600 11px/1.1 Barlow,sans-serif;color:#fff}
.sk{height:90px;margin-bottom:12px;background:var(--line);opacity:.5}
.note{font-size:12px;color:var(--mut);text-align:center;padding:14px 18px 20px}
.empty{color:var(--mut);padding:16px 0;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.fm label{display:block;font:600 12px var(--d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.fm input,.fm select,.fm textarea{width:100%;font:16px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px;appearance:none}
.fm textarea{min-height:90px}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:700 16px var(--d);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:12px 18px;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink)}.btn.del{background:none;color:var(--lose);border:1.5px solid var(--lose)}
.btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.arow{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.hint{font-size:13px;color:var(--mut);margin:8px 0}
.hint code,.hint pre{font-size:12px;background:var(--card);border:1px solid var(--line);padding:2px 5px;border-radius:3px}
.hint pre{display:block;padding:10px;overflow:auto;margin-top:6px}
</style>


</head>
<body>
<header><div class="crest" id="crest"></div><div><h1 id="cname"></h1><small id="csub"></small></div></header>
<main id="main"></main>
<div class="note" id="srcnote"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="bg" onclick="closeSheet()"></div><div class="pn" id="pn"><button class="x" onclick="closeSheet()" aria-label="Close">✕</button><div class="grab"></div><div id="sbody"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===== 1. FIREBASE: paste your web config here (Firebase console > Project settings > Your apps) =====
   Leave as null to show the sample data below. */
const FIREBASE_CONFIG = { apiKey:"AIzaSyAakV_rFhfgQRh1w0srdpX8ArdNxLPlOP4", authDomain:"dinamo-batumi-perla.firebaseapp.com", databaseURL:"https://dinamo-batumi-perla-default-rtdb.europe-west1.firebasedatabase.app", projectId:"dinamo-batumi-perla", storageBucket:"dinamo-batumi-perla.firebasestorage.app", messagingSenderId:"252337389242", appId:"1:252337389242:web:f9226ed316f733699f8c83" };
/* e.g. { apiKey:"...", authDomain:"...", databaseURL:"https://YOURPROJECT-default-rtdb.firebaseio.com", projectId:"..." } */

/* ===== 2. SAMPLE DATA (placeholders only; same shape as the Firebase tree) ===== */
const SAMPLE = {
  club:{name:"Dinamo Batumi",short:"DBA",stadium:"Chele Arena",city:"Batumi",founded:1923,coach:"Coach Name",league:"Erovnuli Liga",logo:""},
  players:{
    p1:{name:"Goalkeeper One",number:1,pos:"GK",nationality:"Georgia",born:"2000-01-01",height:"185 cm",foot:"Right",value:"€000k",contract:"2027-12",apps:0,goals:0,assists:0},
    p2:{name:"Defender One",number:4,pos:"DF",nationality:"Georgia",born:"1999-01-01",height:"183 cm",foot:"Right",value:"€000k",contract:"2027-12",apps:0,goals:0,assists:0},
    p3:{name:"Midfielder One",number:8,pos:"MF",nationality:"Georgia",born:"1998-01-01",height:"178 cm",foot:"Left",value:"€000k",contract:"2026-12",apps:0,goals:0,assists:0},
    p4:{name:"Forward One",number:9,pos:"FW",nationality:"Georgia",born:"2001-01-01",height:"180 cm",foot:"Right",value:"€000k",contract:"2028-06",apps:0,goals:0,assists:0}
  },
  matches:{
    m1:{date:"2026-10-18T17:00",comp:"Erovnuli Liga",home:"Dinamo Batumi",away:"Opponent A",hs:2,as:1,status:"FT",venue:"Chele Arena",
      lineup:{formation:"4-4-2",start:["p1","p2","p2","p2","p2","p3","p3","p3","p3","p4","p4"],subs:["p4"]},
      events:[{min:23,type:"goal",player:"Forward One"},{min:58,type:"sub",player:"Forward One",note:"on for Midfielder One"}]},
    m2:{date:"2026-10-25T17:00",comp:"Erovnuli Liga",home:"Opponent B",away:"Dinamo Batumi",hs:0,as:0,status:"FT",venue:"Opponent B stadium"},
    m3:{date:"2026-11-08T17:00",comp:"Erovnuli Liga",home:"Dinamo Batumi",away:"Opponent C",status:"NS",venue:"Chele Arena"}
  },
  table:{t1:{team:"Dinamo Batumi",p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0},t2:{team:"Opponent A",p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}}
};

/* ===== helpers ===== */
let D = SAMPLE, tab = "home", loading = false;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = o => !o ? [] : (Array.isArray(o) ? o.map((v,i)=>v&&({id:String(i),...v})).filter(Boolean) : Object.entries(o).map(([id,v])=>({id,...v})));
const V = o => !o ? [] : Object.values(o);
const RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
const buzz = () => navigator.vibrate && navigator.vibrate(8);
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  matches:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  squad:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18.5 14.5c2 .8 3 2.800 3 5.500"/></svg>',
  admin:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  table:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="2" cy="6" r=".5"/></svg>'
};
const TABS = [["home","Overview"],["matches","Matches"],["squad","Squad"],["table","Table"]];
const tabs = () => adminOn ? [...TABS,["admin","Admin"]] : TABS;
const POS = [["GK","Goalkeepers"],["DF","Defenders"],["MF","Midfielders"],["FW","Forwards"]];
const fmtDay = d => new Date(d).toLocaleDateString(undefined,{day:"numeric"});
const fmtMon = d => new Date(d).toLocaleDateString(undefined,{month:"short"});
const fmtDate = d => new Date(d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const fmtTime = d => new Date(d).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
const age = b => b ? Math.floor((Date.now()-new Date(b))/31557600000) : "–";
const me = () => D.club.name;
const played = m => m.status === "FT";
const res = m => {
  const h = m.home === me(), a = m.away === me();
  if (!played(m) || (!h && !a)) return "";
  const f = h ? m.hs : m.as, g = h ? m.as : m.hs;
  return f > g ? "W" : f < g ? "L" : "D";
};
const matches = () => L(D.matches).sort((a,b) => new Date(a.date) - new Date(b.date));
const until = d => {
  const ms = new Date(d) - Date.now(); if (ms <= 0) return "Today";
  const m = Math.floor(ms/60000), h = Math.floor(m/60), dd = Math.floor(h/24);
  return dd ? `in ${dd}d ${h%24}h` : h ? `in ${h}h ${m%60}m` : `in ${m}m`;
};
const badge = n => {
  const ini = String(n).split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
  return `<span class="bd${n === me() ? " me" : ""}">${esc(ini)}</span>`;
};
const avatar = p => `<div class="av">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : esc(p.number ?? "")}</div>`;

/* ===== views ===== */
function matchRow(m){
  const r = res(m), sc = played(m) ? `${m.hs} - ${m.as}` : fmtTime(m.date);
  return `<div class="mrow tap" onclick="openMatch('${esc(m.id)}')">
    <div class="date"><b>${fmtDay(m.date)}</b>${fmtMon(m.date)}</div>
    <div class="t"><div>${badge(m.home)}${esc(m.home)}</div><div>${badge(m.away)}${esc(m.away)}</div></div>
    <div class="sc ${r}">${sc}</div>${r ? `<span class="pill ${r}">${r}</span>` : '<span class="chev">→</span>'}</div>`;
}

function renderHome(){
  const all = matches(), done = all.filter(played), next = all.find(m => !played(m)), last = done[done.length-1];
  const form = done.slice(-5).map((m,i) => `<span class="pill ${res(m)}" style="--i:${i}">${res(m)}</span>`).join(" ");
  const top = L(D.players).sort((a,b) => (b.goals||0)-(a.goals||0))[0];
  return `
  ${next ? `<div class="card hero big tap" onclick="openMatch('${esc(next.id)}')"><span class="chip">${esc(next.comp)}</span>
    <div class="teams"><div class="tm">${badge(next.home)}${esc(next.home)}</div><div class="mut">VS</div><div class="tm">${badge(next.away)}${esc(next.away)}</div></div>
    <div class="sm mut">${fmtDate(next.date)} · ${fmtTime(next.date)} · ${esc(next.venue||"")}</div><div class="count">Kick-off ${until(next.date)}</div></div>` : ""}
  ${last ? `<div class="card"><h2>Latest result</h2>${matchRow(last)}</div>` : ""}
  ${form ? `<div class="card"><h2>Form</h2><div class="row">${form}</div></div>` : ""}
  ${top && top.goals ? `<div class="card"><h2>Top scorer</h2><div class="row tap" onclick="openPlayer('${esc(top.id)}')">${avatar(top)}<div><b>${esc(top.name)}</b><div class="sm mut">${top.goals} goals</div></div></div></div>` : ""}
  <div class="card"><h2>Club</h2><div class="sm"><div>${esc(D.club.stadium)}, ${esc(D.club.city)}</div><div class="mut">Founded ${esc(D.club.founded)} · Coach: ${esc(D.club.coach)}</div></div></div>`;
}
function renderMatches(){
  const all = matches(), up = all.filter(m => !played(m)), done = all.filter(played).reverse();
  return `<div class="card"><h2>Upcoming</h2>${up.map(matchRow).join("") || '<div class="empty">No upcoming matches</div>'}</div>
          <div class="card"><h2>Results</h2>${done.map(matchRow).join("") || '<div class="empty">No results yet</div>'}</div>`;
}
function renderSquad(){
  const ps = L(D.players);
  return POS.map(([k,label]) => {
    const g = ps.filter(p => p.pos === k).sort((a,b) => (a.number||99)-(b.number||99));
    return g.length ? `<div class="grp">${label}</div><div class="plist">${g.map(p =>
      `<div class="pc tap" onclick="openPlayer('${esc(p.id)}')">${avatar(p)}<div><b>${esc(p.name)}</b><span class="val">${esc(p.pos)} · ${esc(p.value||"")}</span></div></div>`).join("")}</div>` : "";
  }).join("") || '<div class="empty">No players yet</div>';
}
function renderTable(){
  const rows = L(D.table).sort((a,b) => (b.pts||0)-(a.pts||0) || ((b.gf-b.ga)-(a.gf-a.ga)));
  return `<div class="card"><h2>${esc(D.club.league)}</h2><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
  ${rows.map((r,i) => `<tr class="${r.team===me()?"me":""}"><td>${i+1}</td><td>${esc(r.team)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${(r.gf||0)-(r.ga||0)}</td><td><b>${r.pts}</b></td></tr>`).join("")}</table></div>`;
}

/* ===== sheet (slide-up, swipe down to close) ===== */
const sheet = $("#sheet"), pn = $("#pn");
function openSheet(html){ $("#sbody").innerHTML = html; pn.scrollTop = 0; pn.style.transform = ""; sheet.classList.add("open"); document.body.style.overflow = "hidden"; buzz(); }
function closeSheet(){ sheet.classList.remove("open","drag"); pn.style.transform = ""; document.body.style.overflow = ""; }
addEventListener("keydown", e => e.key === "Escape" && closeSheet());
let y0 = null, dy = 0;
pn.addEventListener("touchstart", e => { if (pn.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, {passive:true});
pn.addEventListener("touchmove", e => {
  if (y0 === null) return; dy = e.touches[0].clientY - y0;
  if (dy > 0) { sheet.classList.add("drag"); pn.style.transform = `translateY(${dy}px)`; } else dy = 0;
}, {passive:true});
pn.addEventListener("touchend", () => { if (y0 === null) return; y0 = null; sheet.classList.remove("drag"); dy > 110 ? closeSheet() : (pn.style.transform = ""); });

function countUp(root){
  root.querySelectorAll("[data-n]").forEach(el => {
    const n = +el.dataset.n || 0; if (RM || !n) { el.textContent = n; return; }
    const t0 = performance.now();
    (function f(t){ const k = Math.min((t - t0)/700, 1); el.textContent = Math.round(n * (1 - Math.pow(1-k,3))); if (k < 1) requestAnimationFrame(f); })(t0);
  });
}
function openPlayer(id){
  const p = L(D.players).find(x => x.id === id); if (!p) return;
  const cell = (v,l) => `<div><b>${esc(v ?? "–")}</b><span>${l}</span></div>`;
  const num = (v,l) => `<div><b data-n="${+v||0}">0</b><span>${l}</span></div>`;
  openSheet(`<div class="row" style="margin-bottom:6px;padding-right:40px">${avatar(p)}<div><h3>${esc(p.name)}</h3><span class="mut sm">#${esc(p.number)} · ${esc(p.pos)} · ${esc(p.nationality)}</span></div></div>
  <div class="grid">${cell(age(p.born),"Age")}${cell(p.height,"Height")}${cell(p.foot,"Foot")}${cell(p.value,"Market value")}${cell(p.contract,"Contract until")}${cell(p.born,"Born")}</div>
  <div class="grp" style="margin-top:6px">Season</div><div class="grid">${num(p.apps,"Apps")}${num(p.goals,"Goals")}${num(p.assists,"Assists")}</div>`);
  countUp($("#sbody"));
}
function pitch(lu){
  const ps = L(D.players), find = id => ps.find(p => p.id === id) || {name:id, number:""};
  const rows = [1, ...String(lu.formation||"").split("-").map(Number).filter(Boolean)];
  const start = V(lu.start); let k = 0, out = "";
  rows.forEach((n,r) => {
    const y = 92 - r * (82 / Math.max(rows.length-1,1));
    for (let i = 0; i < n; i++) {
      const p = find(start[k]), x = (i + 1) * 100 / (n + 1);
      out += `<div class="dot" style="left:${x}%;top:${y}%;--i:${k++}"><i>${esc(p.number)}</i><small>${esc(String(p.name).split(" ").pop())}</small></div>`;
    }
  });
  return `<div class="pitch"><div class="ln mid"></div><div class="ln cc"></div><div class="ln bx t"></div><div class="ln bx b"></div>${out}</div>
  <div class="sm mut">Formation ${esc(lu.formation||"")}${lu.subs ? " · Subs: " + V(lu.subs).map(s => esc(find(s).name)).join(", ") : ""}</div>`;
}
function openMatch(id){
  const m = matches().find(x => x.id === id); if (!m) return;
  const icon = {goal:"Goal",yellow:"Yellow",red:"Red",sub:"Sub"};
  const ev = V(m.events).sort((a,b) => a.min-b.min).map(e => `<div class="ev"><b>${e.min}'</b><span><em>${icon[e.type]||""}</em>${esc(e.player)} <span class="mut">${esc(e.note||"")}</span></span></div>`).join("");
  openSheet(`<div class="big"><span class="chip">${esc(m.comp)}</span>
    <div class="teams"><div class="tm">${badge(m.home)}${esc(m.home)}</div><span class="score">${played(m) ? m.hs+" - "+m.as : "vs"}</span><div class="tm">${badge(m.away)}${esc(m.away)}</div></div>
    <div class="sm mut">${fmtDate(m.date)} · ${esc(m.venue||"")}</div></div>
    ${ev ? `<div class="grp">Events</div>${ev}` : ""}
    ${m.lineup ? `<div class="grp">Lineup</div>${pitch(m.lineup)}` : '<div class="empty">No lineup added yet</div>'}`);
}


/* ===== ADMIN / EDITOR =====
   Open: tap the crest 5 times, or add #admin to the URL.
   Saves go to Firebase (live on every phone). With no FIREBASE_CONFIG it edits in-memory only. */
const LIVE = !!(FIREBASE_CONFIG && typeof firebase !== "undefined");
let adminOn = location.hash === "#admin", authed = !LIVE, taps = 0, db = null;
const SCHEMA = {
  club:[["name","text"],["short","text"],["stadium","text"],["city","text"],["founded","number"],["coach","text"],["league","text"],["logo","text","Image URL"]],
  players:[["name","text"],["number","number"],["pos","select",["GK","DF","MF","FW"]],["nationality","text"],["born","date"],["height","text","e.g. 185 cm"],["foot","select",["Right","Left","Both"]],["value","text","e.g. €300k"],["contract","text","YYYY-MM"],["apps","number"],["goals","number"],["assists","number"],["photo","text","Image URL"]],
  matches:[["date","datetime-local"],["comp","text"],["home","text"],["away","text"],["venue","text"],["status","select",["NS","FT"]],["hs","number","Home score"],["as","number","Away score"]],
  table:[["team","text"],["p","number"],["w","number"],["d","number"],["l","number"],["gf","number"],["ga","number"],["pts","number"]]
};
const setLocal = (path, val) => { const k = path.split("/"); let o = D; k.slice(0,-1).forEach(s => o = o[s] = o[s] || {}); val === null ? delete o[k.at(-1)] : o[k.at(-1)] = val; };
function save(path, val){
  if (LIVE) db.ref(path).set(val).catch(e => alert("Not saved: " + e.message)); else setLocal(path, val);
  render(false);
}
const fld = (name, [k,t,x], v) => t === "select"
  ? `<label>${k}</label><select data-k="${k}">${x.map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`
  : `<label>${x && t!=="select" ? k + " · " + esc(x) : k}</label><input data-k="${k}" type="${t}" inputmode="${t==="number"?"decimal":"text"}" value="${esc(v ?? "")}">`;
const collect = root => { const o = {}; root.querySelectorAll("[data-k]").forEach(el => { if (el.value !== "") o[el.dataset.k] = el.type === "number" ? +el.value : el.value; }); return o; };

function editItem(col, id){
  const isNew = !id; id = id || (LIVE ? db.ref(col).push().key : "n" + Date.now());
  const cur = (col === "club" ? D.club : (D[col] || {})[id]) || {};
  let extra = "";
  if (col === "matches") {
    const lu = cur.lineup || {}, ps = L(D.players).sort((a,b) => (a.number||99)-(b.number||99));
    const sel = (cls, i, v) => `<select class="${cls}"><option value="">(none)</option>${ps.map(p => `<option value="${esc(p.id)}" ${p.id===v?"selected":""}>${esc(p.number??"")} ${esc(p.name)}</option>`).join("")}</select>`;
    const evs = V(cur.events).map(e => [e.min, e.type, e.player, e.note].filter(x => x !== undefined && x !== "").join(", ")).join("\n");
    extra = `<div class="grp">Events</div><div class="hint">One per line: <code>minute, type, player, note</code>. Types: goal, yellow, red, sub.</div><textarea id="evs">${esc(evs)}</textarea>
    <div class="grp">Lineup (optional)</div><label>Formation</label><input id="form" placeholder="4-3-3" value="${esc(lu.formation||"")}">
    <div class="hint">Starting XI: goalkeeper first, then defenders, midfielders, forwards (matches the formation rows).</div>
    ${Array.from({length:11},(_,i) => sel("st", i, V(lu.start)[i])).join("")}<label>Subs</label>${Array.from({length:7},(_,i) => sel("sb", i, V(lu.subs)[i])).join("")}`;
  }
  openSheet(`<div class="fm"><h3>${isNew?"New":"Edit"} ${col==="club"?"club":col.slice(0,-1)}</h3>${SCHEMA[col].map(f => fld(col, f, cur[f[0]])).join("")}${extra}
    <div class="btns"><button class="btn" onclick="commit('${col}','${id}')">Save</button>${!isNew && col!=="club" ? `<button class="btn del" onclick="del('${col}','${id}')">Delete</button>` : ""}<button class="btn alt" onclick="closeSheet()">Cancel</button></div></div>`);
}
function commit(col, id){
  const o = collect($("#sbody"));
  if (col === "matches") {
    o.events = ($("#evs").value.split("\n").map(l => l.split(",").map(s => s.trim())).filter(a => a[0] && a[2]).map(a => ({min:+a[0], type:a[1], player:a[2], ...(a[3] ? {note:a.slice(3).join(", ")} : {})})));
    const st = [...document.querySelectorAll(".st")].map(s => s.value).filter(Boolean), sb = [...document.querySelectorAll(".sb")].map(s => s.value).filter(Boolean);
    if (st.length) o.lineup = {formation:$("#form").value.trim(), start:st, ...(sb.length ? {subs:sb} : {})};
    if (!o.events.length) delete o.events;
  }
  save(col === "club" ? "club" : col + "/" + id, col === "club" ? {...D.club, ...o} : o); closeSheet();
}
function del(col, id){ if (confirm("Delete this entry?")) { save(col + "/" + id, null); closeSheet(); } }
function login(){ firebase.auth().signInWithEmailAndPassword($("#em").value, $("#pw").value).catch(e => alert(e.message)); }
function exportJSON(){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"})); a.download = "club-backup.json"; a.click(); }
function seed(){ if (LIVE && confirm("Overwrite the database with the sample data?")) db.ref("/").set(SAMPLE); }

function renderAdmin(){
  if (!authed) return `<div class="card fm"><h2>Admin sign in</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="btns"><button class="btn" onclick="login()">Sign in</button></div></div>`;
  const list = (col, items, line) => `<div class="card"><div class="row" style="justify-content:space-between"><h2>${col}</h2><button class="btn alt" onclick="editItem('${col}')">+ Add</button></div>${items.map(x => `<div class="arow tap" onclick="editItem('${col}','${esc(x.id)}')">${line(x)}<span class="chev">→</span></div>`).join("") || '<div class="empty">Nothing yet</div>'}</div>`;
  return `${LIVE ? "" : '<div class="hint">Local mode: edits are not saved. Add FIREBASE_CONFIG to go live.</div>'}
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Club</h2><button class="btn alt" onclick="editItem('club')">Edit</button></div><div class="hint">If you rename the club, update the team name in matches and table to match.</div></div>
  ${list("players", L(D.players).sort((a,b)=>(a.number||99)-(b.number||99)), p => `<span><b>${esc(p.number??"")}</b> ${esc(p.name)} <span class="mut">${esc(p.pos)}</span></span>`)}
  ${list("matches", matches().reverse(), m => `<span>${fmtDate(m.date)}: ${esc(m.home)} v ${esc(m.away)}</span>`)}
  ${list("table", L(D.table), t => `<span>${esc(t.team)} <span class="mut">${t.pts} pts</span></span>`)}
  <div class="btns"><button class="btn alt" onclick="exportJSON()">Export backup</button>${LIVE ? '<button class="btn alt" onclick="seed()">Load sample data</button><button class="btn alt" onclick="firebase.auth().signOut()">Sign out</button>' : ""}</div>`;
}
$("#crest").addEventListener("click", () => { if (++taps >= 5) { adminOn = true; tab = "admin"; render(true); } setTimeout(() => taps = 0, 2500); });

/* ===== render ===== */
function render(animate){
  $("#cname").textContent = D.club.name;
  $("#csub").textContent = `${D.club.league} · ${D.club.city}`;
  $("#crest").innerHTML = D.club.logo ? `<img src="${esc(D.club.logo)}" alt="">` : esc(D.club.short || "D");
  $("#nav").innerHTML = tabs().map(([k,l]) => `<button class="${k===tab?"on":""}" onclick="go('${k}')">${ICON[k]}${l}</button>`).join("");
  const main = $("#main");
  main.className = animate ? "anim" : "";
  main.innerHTML = loading ? '<div class="sk"></div><div class="sk" style="height:140px"></div><div class="sk"></div>'
    : {home:renderHome,matches:renderMatches,squad:renderSquad,table:renderTable,admin:renderAdmin}[tab]();
  if (animate) main.querySelectorAll(".card,.pc,.grp").forEach((el,i) => el.style.setProperty("--i", Math.min(i,9)));
}
function go(t){ if (t === tab) return; tab = t; buzz(); render(true); scrollTo({top:0}); }

/* ===== start ===== */
if (LIVE) {
  loading = true; render(true);
  firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
  firebase.auth().onAuthStateChanged(u => { authed = !!u; if (tab === "admin" && !sheet.classList.contains("open")) render(false); });
  db.ref("/").on("value", s => {
    D = {club:SAMPLE.club, players:{}, matches:{}, table:{}, ...(s.val() || {})}; $("#srcnote").textContent = "";
    const was = loading; loading = false; if (!sheet.classList.contains("open") || was) render(was);
  });
  setTimeout(() => { if (loading) { loading = false; $("#srcnote").textContent = "Couldn't reach the database. Showing sample data."; render(true); } }, 8000);
} else {
  $("#srcnote").textContent = "Showing sample data. Add your Firebase config to go live.";
  if (adminOn) tab = "admin";
  render(true);
}
setInterval(() => { if (tab === "home" && !loading && !sheet.classList.contains("open")) render(false); }, 60000);
</script>
</body>
