/* ===== sheet (slide-up, swipe down to close) ===== */
const sheet = $("#sheet"), pn = $("#pn");
function openSheet(html){ $("#sbody").innerHTML = html; pn.scrollTop = 0; pn.style.transform = ""; sheet.classList.add("open"); document.body.style.overflow = "hidden"; buzz(); }
function closeSheet(){ sheet.classList.remove("open","drag"); pn.style.transform = ""; document.body.style.overflow = ""; }

let y0 = null, dy = 0;
pn.addEventListener("touchstart", e => { if (pn.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, {passive:true});
pn.addEventListener("touchmove", e => {

function countUp(root){
  root.querySelectorAll("[data-n]").forEach(el => {
    const n = +el.dataset.n || 0; if (RM || !n) { el.textContent = n; return; }
    const t0 = performance.now();
    (function f(t){ const k = Math.min((t - t0)/700, 1); el.textContent = Math.round(n * (1 - Math.pow(1-k,3))); if (k < 1) requestAnimationFrame(f); })(t0);
  });
}
function openPlayer(id){

function pitch(lu){
  const ps = L(D.players), find = id => ps.find(p => p.id === id) || {name:id, number:""};
  const rows = [1, ...String(lu.formation||"").split("-").map(Number).filter(Boolean)];
  const start = V(lu.start); let k = 0, out = "";
  rows.forEach((n,r) => {
    const y = 92 - r * (82 / Math.max(rows.length-1,1));
    for (let i = 0; i < n; i++) {
      const p = find(start[k]), x = (i + 1) * 100 / (n + 1);
      out += `<div class="dot" style="left:${x}%;top:${y}%;--i:${k++}"><i>${esc(p.number)}</i><small>${esc(String(pname(p)).split(" ").pop())}</small></div>`;
    }
  });
  return `<div class="pitch"><div class="ln mid"></div><div class="ln cc"></div><div class="ln bx t"></div><div class="ln bx b"></div>${out}</div>
  <div class="sm mut">${T("Formation")} ${esc(lu.formation||"")}${lu.subs ? " · " + T("Subs") + ": " + V(lu.subs).map(s => esc(pname(find(s)))).join(", ") : ""}</div>`;
}
function openMatch(id){

    <div class="teams"><div class="tm">${badge(m.home)}${esc(m.home)}</div><span class="score">${played(m) ? m.hs+" - "+m.as : "vs"}</span><div class="tm">${badge(m.away)}${esc(m.away)}</div></div>

function editItem(col, id){

  return `${LIVE ? "" : '<div class="hint">Local mode: edits are not saved. Add FIREBASE_CONFIG to go live.</div>'}
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Club</h2><button class="btn alt" onclick="editItem('club')">Edit</button></div><div class="hint">If you rename the club, update the team name in matches and table to match.</div></div>
  ${list("players", L(D.players).sort((a,b)=>(a.number||99)-(b.number||99)), p => `<span><b>${esc(p.number??"")}</b> ${esc(p.name)} <span class="mut">${esc(p.pos)}</span></span>`)}
  ${list("matches", matches().reverse(), m => `<span>${fmtDate(m.date)}: ${esc(m.home)} v ${esc(m.away)}</span>`)}
  ${list("table", L(D.table), t => `<span>${esc(t.team)} <span class="mut">${t.pts} pts</span></span>`)}
  <div class="btns"><button class="btn alt" onclick="exportJSON()">Export backup</button>${LIVE ? '<button class="btn alt" onclick="seed()">Load sample data</button><button class="btn alt" onclick="firebase.auth().signOut()">Sign out</button>' : ""}</div>`;
}
$("#crest").addEventListener("click", () => { if (++taps >= 5) { adminOn = true; tab = "admin"; render(true); } setTimeout(() => taps = 0, 2500); });

const cbSet = (inp, name) => { inp.value = name; inp.nextElementSibling.hidden = true; inp.parentElement.previousElementSibling.querySelector(".cbf").innerHTML = flag(name); };
$("#sbody").addEventListener("input", e => {
  const i = e.target; if (!i.classList.contains("cbi")) return;
  const q = i.value.trim().toLowerCase(), box = i.nextElementSibling;
  i.parentElement.previousElementSibling.querySelector(".cbf").innerHTML = flag(i.value);
  const r = COUNTRIES.filter(([c,n]) => n.toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = r.map(([c,n]) => `<div data-n="${esc(n)}">${flag(n)}${esc(n)}</div>`).join(""); box.hidden = !q || !r.length;
});
$("#sbody").addEventListener("click", e => { const d = e.target.closest(".cbl div"); if (d) cbSet(d.parentElement.previousElementSibling, d.dataset.n); });
/* ===== render ===== */
function render(animate){
  $("#cname").textContent = D.club.name; $("#gear").setAttribute("aria-label", T("Settings"));
  $("#csub").textContent = `${D.club.league} · ${D.club.city}`;
  $("#crest").innerHTML = D.club.logo ? `<img src="${esc(D.club.logo)}" alt="">` : esc(D.club.short || "D");
  $("#nav").innerHTML = tabs().map(([k,l]) => `<button class="${k===tab?"on":""}" onclick="go('${k}')">${ICON[k]}${T(l)}</button>`).join("");
  const main = $("#main");
  main.className = animate ? "anim" : "";
  main.innerHTML = loading ? '<div class="sk"></div><div class="sk" style="height:140px"></div><div class="sk"></div>'
    : {home:renderHome,matches:renderMatches,squad:renderSquad,table:renderTable,admin:renderAdmin}[tab]();
  if (animate) main.querySelectorAll(".card,.pc,.grp").forEach((el,i) => el.style.setProperty("--i", Math.min(i,9)));
}
function go(t){ if (t === tab) return; tab = t; buzz(); render(true); scrollTo({top:0}); }

/* ===== start ===== */
if (LIVE) {
  loading = true; render(true);
  firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
  firebase.auth().onAuthStateChanged(u => { authed = !!u; if (tab === "admin" && !sheet.classList.contains("open")) render(false); });
  db.ref("/").on("value", s => {
    D = {club:SAMPLE.club, players:{}, matches:{}, table:{}, ...(s.val() || {})}; $("#srcnote").textContent = "";
    const was = loading; loading = false; if (!sheet.classList.contains("open") || was) render(was);
  });
  setTimeout(() => { if (loading) { loading = false; $("#srcnote").textContent = T("Couldn't reach the database. Showing sample data."); render(true); } }, 8000);
} else {
  $("#srcnote").textContent = T("Showing sample data. Add your Firebase config to go live.");
  if (adminOn) tab = "admin";
  render(true);
}
setInterval(() => { if (tab === "home" && !loading && !sheet.classList.contains("open")) render(false); }, 60000);
</script>
</body>
</html>
